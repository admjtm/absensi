<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Absensi Mahasiswa — Jurusan Teknik Mesin PNP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --bg:#EEF2F4;
    --paper:#F7F9FA;
    --surface:#FFFFFF;
    --ink:#0F2340;
    --ink-soft:#4C5C72;
    --primary:#1F3A63;
    --primary-light:#2C5490;
    --accent:#E8871E;
    --accent-ink:#7A4506;
    --danger:#B23A2E;
    --success:#2E7D6B;
    --info:#4A6FA5;
    --line:#D7DEE3;
    --line-strong:#B9C4CC;
    --radius:10px;
    --shadow:0 1px 2px rgba(15,35,64,.06), 0 6px 16px rgba(15,35,64,.06);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Inter',sans-serif;
    color:var(--ink);
    background:
      linear-gradient(var(--line) 1px, transparent 1px) 0 0/100% 28px,
      linear-gradient(90deg, var(--line) 1px, transparent 1px) 0 0/28px 100%,
      var(--bg);
    background-attachment:fixed;
    background-blend-mode:normal;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  body::before{
    content:"";
    position:fixed; inset:0;
    background-image:
      linear-gradient(rgba(238,242,244,.86), rgba(238,242,244,.86));
    pointer-events:none; z-index:-1;
  }
  h1,h2,h3,.display{font-family:'Space Grotesk',sans-serif; letter-spacing:-.01em;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  button{font-family:inherit; cursor:pointer;}
  input,select{font-family:inherit;}
  ::selection{background:var(--accent); color:#fff;}

  /* ---------- Admin notification toast (upload real-time) ---------- */
  .admin-toast-container{
    position:fixed; top:74px; right:20px; z-index:80;
    display:flex; flex-direction:column; gap:10px; align-items:flex-end;
    pointer-events:none;
  }
  .admin-toast{
    pointer-events:auto;
    display:flex; align-items:flex-start; gap:10px;
    background:var(--surface); border:1px solid var(--line); border-left:3px solid var(--accent);
    border-radius:var(--radius); box-shadow:var(--shadow);
    padding:12px 14px; min-width:240px; max-width:320px;
    animation:toastIn .18s ease-out;
  }
  .admin-toast .icon{
    width:28px; height:28px; border-radius:50%; background:var(--accent); color:var(--accent-ink);
    display:flex; align-items:center; justify-content:center; flex-shrink:0; font-size:14px;
  }
  .admin-toast .body{flex:1; min-width:0;}
  .admin-toast .title{font-size:13px; font-weight:700; color:var(--ink); line-height:1.3;}
  .admin-toast .sub{font-size:11.5px; color:var(--ink-soft); margin-top:2px;}
  .admin-toast .close{background:none; border:none; color:var(--ink-soft); font-size:14px; padding:0 2px; flex-shrink:0;}
  .admin-toast .close:hover{color:var(--ink);}
  @keyframes toastIn{ from{opacity:0; transform:translateX(16px);} to{opacity:1; transform:translateX(0);} }

  /* ---------- Notification bell + dropdown ---------- */
  .notif-bell-wrap{position:relative;}
  .notif-bell-btn{
    position:relative; width:38px; height:38px; border-radius:50%;
    border:1px solid rgba(255,255,255,.22); background:rgba(255,255,255,.1); color:#fff;
    display:flex; align-items:center; justify-content:center; font-size:17px;
    transition:.15s;
  }
  .notif-bell-btn:hover{background:rgba(255,255,255,.18);}
  .notif-bell-dot{
    position:absolute; top:6px; right:7px; width:9px; height:9px; border-radius:50%;
    background:var(--danger); border:1.5px solid var(--primary);
  }
  .notif-panel{
    position:absolute; top:calc(100% + 10px); right:0; z-index:90;
    width:320px; max-height:420px; overflow-y:auto;
    background:var(--surface); color:var(--ink); border:1px solid var(--line); border-radius:var(--radius);
    box-shadow:0 12px 32px rgba(15,35,64,.22);
  }
  .notif-panel-head{
    position:sticky; top:0; background:var(--surface); z-index:1;
    display:flex; align-items:center; justify-content:space-between;
    padding:12px 14px; border-bottom:1px solid var(--line);
  }
  .notif-panel-head h4{margin:0; font-size:13.5px; font-weight:700;}
  .notif-panel-head button{background:none; border:none; font-size:11.5px; color:var(--primary-light); font-weight:600;}
  .notif-item{
    display:flex; align-items:flex-start; gap:10px; padding:11px 14px;
    border-bottom:1px solid var(--line); position:relative;
  }
  .notif-item:last-child{border-bottom:none;}
  .notif-item.unread{background:#F3F8FE;}
  .notif-item .icon{
    width:30px; height:30px; border-radius:50%; background:var(--accent); color:var(--accent-ink);
    display:flex; align-items:center; justify-content:center; flex-shrink:0; font-size:14px; margin-top:1px;
  }
  .notif-item .body{flex:1; min-width:0;}
  .notif-item .title{font-size:12.5px; font-weight:700; color:var(--ink); line-height:1.35;}
  .notif-item .sub{font-size:11px; color:var(--ink-soft); margin-top:2px;}
  .notif-item .time{font-size:10.5px; color:var(--ink-soft); margin-top:4px; font-family:'IBM Plex Mono';}
  .notif-item .unread-dot{width:7px; height:7px; border-radius:50%; background:var(--danger); flex-shrink:0; margin-top:6px;}
  .notif-empty{padding:32px 16px; text-align:center; color:var(--ink-soft); font-size:12.5px;}

  /* ---------- Topbar ---------- */
  .topbar{
    position:sticky; top:0; z-index:40;
    background:var(--primary);
    color:#fff;
    border-bottom:3px solid var(--accent);
  }
  .topbar-inner{
    max-width:1720px; margin:0 auto; padding:14px 20px;
    display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap;
  }
  .brand{display:flex; align-items:center; gap:12px;}
  .topbar-right{display:flex; align-items:center; gap:12px;}
  .brand-logos{display:flex; align-items:center; gap:8px; flex-shrink:0;}
  .brand-logo{
    width:40px;height:40px;border-radius:8px;
    background:#fff;
    object-fit:contain;
    padding:2px;
    box-shadow:inset 0 0 0 2px rgba(15,35,64,.1);
    flex-shrink:0;
  }
  .brand-text .eyebrow{font-size:11px; letter-spacing:.14em; text-transform:uppercase; opacity:.75; font-weight:600;}
  .brand-text h1{font-size:17px; margin:1px 0 0; font-weight:700; line-height:1.2;}

  .role-switch{
    display:flex; background:rgba(255,255,255,.1); border-radius:999px; padding:3px; gap:2px;
    border:1px solid rgba(255,255,255,.18);
  }
  .role-switch button{
    border:none; background:transparent; color:rgba(255,255,255,.75);
    padding:7px 16px; border-radius:999px; font-size:13px; font-weight:600;
    transition:.15s;
  }
  .role-switch button.active{ background:var(--accent); color:var(--primary); }

  /* ---------- Layout ---------- */
  .wrap{max-width:1720px; margin:0 auto; padding:24px 20px 64px;}
  /* Rekap per minggu punya banyak kolom, biarkan lebih lebar dari wrap biasa agar tidak mepet */
  .panel:has(.excel-table--fit){max-width:none;}

  .selector-card{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    box-shadow:var(--shadow); padding:18px 20px; margin-bottom:18px;
  }
  .selector-row{display:flex; flex-wrap:wrap; gap:22px; align-items:flex-start;}
  .selector-group{flex:1; min-width:240px;}
  .selector-label{font-size:11px; text-transform:uppercase; letter-spacing:.1em; color:var(--ink-soft); font-weight:700; margin-bottom:8px; display:block;}
  .prodi-tabs{display:flex; flex-wrap:wrap; gap:8px;}
  .prodi-tab{
    border:1px solid var(--line-strong); background:var(--paper); color:var(--ink);
    padding:8px 12px; border-radius:8px; font-size:12.5px; font-weight:600;
    display:flex; flex-direction:column; align-items:flex-start; gap:2px; line-height:1.25;
    transition:.15s; min-width:120px;
  }
  .prodi-tab .code{font-family:'IBM Plex Mono'; font-size:10.5px; color:var(--accent-ink); font-weight:600;}
  .prodi-tab:hover{border-color:var(--primary-light);}
  .prodi-tab.active{background:var(--primary); border-color:var(--primary); color:#fff;}
  .prodi-tab.active .code{color:var(--accent);}

  .kelas-chips{display:flex; flex-wrap:wrap; gap:6px;}
  .kelas-chip{
    border:1px solid var(--line-strong); background:var(--paper);
    padding:6px 12px; border-radius:999px; font-size:12.5px; font-weight:600; color:var(--ink-soft);
    font-family:'IBM Plex Mono';
  }
  .kelas-chip.active{background:var(--accent); border-color:var(--accent); color:var(--accent-ink);}
  .kelas-chip:hover{border-color:var(--primary-light); color:var(--ink);}

  /* ---------- Tabs ---------- */
  .tabnav{display:flex; gap:4px; border-bottom:1px solid var(--line-strong); margin-bottom:20px; flex-wrap:wrap;}
  .tabnav button{
    border:none; background:none; padding:10px 16px; font-size:13.5px; font-weight:600;
    color:var(--ink-soft); border-bottom:2px solid transparent; margin-bottom:-1px;
  }
  .tabnav button.active{color:var(--primary); border-bottom-color:var(--accent);}
  .tabnav button:hover{color:var(--primary);}

  /* ---------- Card with corner brackets (signature element) ---------- */
  .panel{
    position:relative;
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    box-shadow:var(--shadow); padding:22px 24px; margin-bottom:18px;
  }
  .panel::before,.panel::after,.panel .cb1,.panel .cb2{
    content:""; position:absolute; width:14px; height:14px; pointer-events:none;
  }
  .panel::before{ top:-1px; left:-1px; border-top:2px solid var(--accent); border-left:2px solid var(--accent); }
  .panel::after{ bottom:-1px; right:-1px; border-bottom:2px solid var(--accent); border-right:2px solid var(--accent); }
  .panel-head{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:16px; flex-wrap:wrap;}
  .panel-head h2{font-size:16px; margin:0; font-weight:700;}
  .panel-head p{font-size:12.5px; color:var(--ink-soft); margin:3px 0 0;}

  /* ---------- Buttons ---------- */
  .btn{
    display:inline-flex; align-items:center; gap:6px; border-radius:7px; padding:8px 14px;
    font-size:13px; font-weight:600; border:1px solid transparent; transition:.15s;
  }
  .btn-primary{background:var(--primary); color:#fff;}
  .btn-primary:hover{background:var(--primary-light);}
  .btn-accent{background:var(--accent); color:var(--accent-ink);}
  .btn-accent:hover{filter:brightness(1.05);}
  .btn-ghost{background:transparent; border-color:var(--line-strong); color:var(--ink-soft);}
  .btn-ghost:hover{border-color:var(--primary-light); color:var(--primary);}
  .btn-danger-ghost{background:transparent; border-color:var(--line-strong); color:var(--danger);}
  .btn-danger-ghost:hover{background:#FBEBE9; border-color:var(--danger);}
  .btn-sm{padding:5px 10px; font-size:12px;}
  .btn:disabled{opacity:.45; cursor:not-allowed;}

  /* ---------- Table ---------- */
  table{width:100%; border-collapse:collapse; font-size:13px;}
  th{
    text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.07em; color:var(--ink-soft);
    padding:9px 10px; border-bottom:1px solid var(--line-strong); font-weight:700;
  }
  td{padding:9px 10px; border-bottom:1px solid var(--line);}
  tr:last-child td{border-bottom:none;}
  .nim{font-family:'IBM Plex Mono'; color:var(--primary); font-weight:500;}

  /* ---------- Excel-style recap table ---------- */
  .excel-table{border-collapse:collapse; width:100%; font-size:12.5px;}
  .excel-table th,.excel-table td{border:1px solid #444B54;}
  .excel-table thead th{
    background:var(--paper); color:var(--ink); text-transform:none; letter-spacing:0;
    font-weight:700; font-size:12.5px; text-align:center; padding:7px 8px; vertical-align:middle;
  }
  .excel-table tbody td{padding:6px 10px;}
  .excel-table tbody tr:nth-child(even){background:#FAFBFC;}
  .excel-table tbody tr:hover{background:#EEF4FA;}
  /* Tabel dengan banyak kolom (rekap per minggu): lebar tiap kolom diatur presisi lewat <colgroup>
     (lihat renderWeeklyRecap) memakai table-layout:fixed + width:100%, sehingga tabel selalu pas
     memenuhi satu layar tanpa perlu digeser, dan semua kolom S/I/A ukurannya sama persis. */
  .excel-table-scroll{
    overflow-x:auto; overflow-y:visible; border:1px solid var(--line-strong); border-radius:8px;
  }
  .excel-table--fit{
    table-layout:fixed; width:100%;
  }
  .excel-table--fit th, .excel-table--fit td{
    font-size:10.5px; padding:4px 3px; overflow:hidden; text-overflow:ellipsis;
    line-height:1.3; text-align:center; border:1px solid #444B54;
  }
  /* Kontrol zoom untuk foto scan absensi (modal "Lihat scan" & "Isi Rekap") -- supaya
     tulisan tangan di lembar absensi bisa diperbesar saat perlu dibaca lebih jelas. */
  .img-zoom-controls{ display:flex; align-items:center; gap:4px; margin-bottom:8px; }
  .img-zoom-controls .zoom-label{ font-size:12px; min-width:42px; text-align:center; }
  .img-zoom-viewport{
    overflow:auto; max-height:65vh; border:1px solid var(--line-strong); border-radius:8px;
    background:#f3f3f3; touch-action:pinch-zoom;
  }
  .img-zoom-target{ display:block; cursor:zoom-in; }
  .excel-table--fit thead th{ padding:4px 3px; font-size:10px; text-align:center; vertical-align:middle; white-space:normal; word-break:break-word; }
  .excel-table--fit tbody td{ white-space:nowrap; }
  .excel-table--fit td.nim, .excel-table--fit td.mono{ font-size:10.5px; }
  .excel-table--fit th:nth-child(3), .excel-table--fit td:nth-child(3){
    text-align:left; white-space:normal;
  }
  .excel-table--fit tbody tr:nth-child(even) td{ background:#FAFBFC; }
  .excel-table--fit td.ket-cell{ text-align:left; white-space:normal; }
  /* Tabel "Rekap Total Gabungan Semua Mata Kuliah" -- dibedakan dari tabel Rekap per Minggu
     dengan header solid warna korporat + aksen warna lembut pada kolom S/I/A, tanpa
     berlebihan supaya tetap terlihat profesional/rapi. */
  .excel-table-total{ border-collapse:collapse; width:100%; font-size:13px; }
  .excel-table-total th, .excel-table-total td{ border:1px solid #444B54; }
  .excel-table-total thead th{
    background:var(--primary); color:#fff; font-weight:700; text-align:center;
    padding:8px; vertical-align:middle;
  }
  .excel-table-total tbody td{ padding:6px 10px; }
  .excel-table-total tbody tr:nth-child(even) td{ background:#F4F6F8; }
  .excel-table-total tbody tr:nth-child(odd) td{ background:#FFFFFF; }
  .excel-table-total tbody tr:hover td{ background:#EAF0F6; }
  .excel-table-total td.col-s{ background:#EAF5F1 !important; color:#1B6B4C; font-weight:600; }
  .excel-table-total td.col-i{ background:#FCF3E3 !important; color:#8A5A00; font-weight:600; }
  .excel-table-total td.col-a{ background:#FBEAE8 !important; color:#A32C1E; font-weight:600; }
  .excel-table-total td.col-jumlah{ background:#F1F3F6 !important; color:var(--ink); font-weight:700; }
  .excel-table-total td.col-komp{ background:#EDEBF5 !important; color:#4A2E8A; font-weight:700; }
  .empty-state{
    text-align:center; padding:36px 20px; color:var(--ink-soft);
  }
  .empty-state .glyph{font-size:26px; margin-bottom:8px;}
  .empty-state h3{font-size:14px; color:var(--ink); margin:0 0 4px;}
  .empty-state p{font-size:12.5px; margin:0;}

  /* ---------- Forms ---------- */
  .field-row{display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end;}
  .field{display:flex; flex-direction:column; gap:5px;}
  .field label{font-size:11px; font-weight:700; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.06em;}
  .field input,.field select{
    border:1px solid var(--line-strong); border-radius:7px; padding:8px 10px; font-size:13px; color:var(--ink);
    background:var(--paper); min-width:160px;
  }
  .field input:focus,.field select:focus{outline:2px solid var(--primary-light); outline-offset:1px; border-color:var(--primary-light);}

  /* ---------- Chips list (matkul) ---------- */
  .chip-list{display:flex; flex-wrap:wrap; gap:8px; margin-top:14px;}
  .matkul-chip{
    display:flex; align-items:center; gap:8px; background:var(--paper); border:1px solid var(--line-strong);
    border-radius:999px; padding:6px 8px 6px 14px; font-size:12.5px; font-weight:600;
  }
  .matkul-chip button{border:none; background:var(--line-strong); color:var(--ink); width:18px; height:18px; border-radius:50%; font-size:11px; line-height:1;}
  .matkul-chip button:hover{background:var(--danger); color:#fff;}

  /* ---------- Scan cards ---------- */
  .scan-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:14px; margin-top:14px;}
  .scan-card{border:1px solid var(--line); border-radius:9px; overflow:hidden; background:var(--paper);}
  .scan-thumb{width:100%; height:130px; object-fit:cover; display:block; background:#dde3e7; cursor:zoom-in;}
  .scan-meta{padding:10px 12px;}
  .scan-meta .mk{font-size:12.5px; font-weight:700; margin:0 0 2px;}
  .scan-meta .dt{font-size:11.5px; color:var(--ink-soft); font-family:'IBM Plex Mono'; margin:0 0 8px;}
  .scan-actions{display:flex; gap:6px;}

  /* stamp badge */
  .stamp{
    display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:5px;
    font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.05em;
    border:1.5px dashed currentColor;
  }
  .stamp-done{color:var(--success);}
  .stamp-pending{color:var(--accent-ink);}

  /* ---------- Status radio "stamps" ---------- */
  .status-group{display:flex; gap:4px;}
  .status-opt{position:relative;}
  .status-opt input{position:absolute; opacity:0; inset:0; cursor:pointer;}
  .status-opt span{
    display:block; padding:5px 9px; border-radius:6px; font-size:11px; font-weight:700; text-align:center;
    border:1.5px solid var(--line-strong); color:var(--ink-soft); min-width:44px;
  }
  .status-opt input:checked + span.H{background:#E4F3EE; border-color:var(--success); color:var(--success);}
  .status-opt input:checked + span.I{background:#FDF0DE; border-color:var(--accent); color:var(--accent-ink);}
  .status-opt input:checked + span.S{background:#E9EFF8; border-color:var(--info); color:var(--info);}
  .status-opt input:checked + span.A{background:#FAE7E5; border-color:var(--danger); color:var(--danger);}
  .status-opt input:focus-visible + span{outline:2px solid var(--primary-light); outline-offset:1px;}

  /* ---------- Hari checkbox "chips" (multi-pilih) ---------- */
  .hari-group{display:flex; flex-wrap:wrap; gap:8px 8px;}
  .hari-opt{position:relative; display:inline-flex;}
  .hari-opt input{position:absolute; opacity:0; inset:0; cursor:pointer;}
  .hari-opt span{
    display:block; padding:7px 14px; border-radius:8px; font-size:12.5px; font-weight:600; text-align:center;
    border:1.5px solid var(--line-strong); color:var(--ink-soft); white-space:nowrap; min-width:58px;
    transition:background .12s ease, border-color .12s ease, color .12s ease;
  }
  .hari-opt input:checked + span{background:var(--primary); border-color:var(--primary); color:#fff;}
  .hari-opt input:hover + span{border-color:var(--primary-light);}
  .hari-opt input:focus-visible + span{outline:2px solid var(--primary-light); outline-offset:1px;}
  .hari-hint{margin:0 0 8px; font-size:12px; color:var(--ink-soft);}

  /* ---------- Modal ---------- */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(15,35,64,.55); backdrop-filter:blur(1px);
    display:flex; align-items:center; justify-content:center; padding:20px; z-index:100;
  }
  .modal{
    background:#fff; border-radius:12px; max-width:760px; width:100%; max-height:88vh; overflow:auto;
    box-shadow:0 20px 60px rgba(0,0,0,.3);
  }
  .modal-head{display:flex; align-items:center; justify-content:space-between; padding:16px 20px; border-bottom:1px solid var(--line); position:sticky; top:0; background:#fff;}
  .modal-head h3{margin:0; font-size:15px;}
  .modal-close{border:none; background:var(--paper); width:28px; height:28px; border-radius:50%; font-size:15px; color:var(--ink-soft);}
  .modal-body{padding:18px 20px;}
  .modal img.full{width:100%; border-radius:8px; border:1px solid var(--line); margin-bottom:16px;}

  .stat-row{display:flex; gap:12px; flex-wrap:wrap; margin-bottom:18px;}
  .stat-box{flex:1; min-width:130px; background:var(--surface); border:1px solid var(--line); border-radius:9px; padding:12px 14px;}
  .stat-box .num{font-family:'Space Grotesk'; font-size:22px; font-weight:700; color:var(--primary);}
  .stat-box .lab{font-size:11px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.06em; font-weight:600;}

  .note{
    font-size:12px; color:var(--ink-soft); background:var(--paper); border:1px dashed var(--line-strong);

const ADMIN_PIN = '2025';

// PIN untuk menu "Upload Absensi" di sisi Ketua Kelas -- satu PIN sama dipakai untuk SEMUA
// kelas (bukan beda-beda per kelas). PIN yang benar hanya berlaku untuk HARI itu saja: kalau
// tanggal sudah berganti (mis. dibuka lagi besok), Ketua Kelas harus memasukkan PIN ulang.
// Ganti angka ini sesuai kebutuhan.
const KETUA_UPLOAD_PIN = '1234';
const KETUA_UPLOAD_UNLOCK_KEY = 'absensi_ketua_upload_unlock_v1';
function isKetuaUploadUnlockedToday(){
  try{ return localStorage.getItem(KETUA_UPLOAD_UNLOCK_KEY) === todayStr(); }
  catch(e){ return false; } // localStorage diblokir/penuh -- anggap belum unlock, aman secara default
}
function setKetuaUploadUnlockedToday(){
  try{ localStorage.setItem(KETUA_UPLOAD_UNLOCK_KEY, todayStr()); }
  catch(e){ /* abaikan -- tidak fatal, cuma PIN akan diminta lagi tiap buka */ }
}

// PERBAIKAN NOTIFIKASI: dulu status "sudah pernah masuk mode Admin" (adminUnlocked) cuma
// disimpan di memori (variable JS biasa), jadi HILANG setiap halaman di-reload/dibuka ulang.
// Akibatnya perangkat yang tadinya sudah login Admin (misalnya komputer admin) balik lagi
// jadi "belum login", polling notifikasi berhenti, dan notifikasi/lonceng tidak pernah
// update lagi sampai PIN dimasukkan ulang secara manual -- ini penyebab utama kenapa
// notifikasi cuma kelihatan di HP (yang kebetulan tab-nya tidak pernah di-reload) tapi
// tidak muncul di komputer. Sekarang status ini disimpan permanen di localStorage per
// perangkat/browser, supaya begitu 1x login Admin di suatu perangkat, perangkat itu akan
// terus otomatis memantau notifikasi upload walau halaman dibuka ulang atau ditutup-buka lagi.
const ADMIN_UNLOCKED_KEY = 'absensiJtm_adminUnlocked';
function isAdminUnlockedPersisted_(){
  try{ return localStorage.getItem(ADMIN_UNLOCKED_KEY) === '1'; }
  catch(e){ return false; }
}
function setAdminUnlockedPersisted_(v){
  try{
    if(v) localStorage.setItem(ADMIN_UNLOCKED_KEY, '1');
    else localStorage.removeItem(ADMIN_UNLOCKED_KEY);
  }catch(e){ /* localStorage diblokir/penuh -- abaikan, tidak fatal */ }
}

  adminUnlocked: isAdminUnlockedPersisted_(), // true kalau PIN Admin PERNAH benar di perangkat ini

function currentProdi(){ return PRODI.find(p=>p.key===state.prodi); }
function keyBase(){ return state.prodi+':'+state.kelas; }

// Cache lokal (per kelas) di browser supaya kelas yang sudah pernah dibuka bisa langsung
// tampil instan (tidak nunggu "Memuat data kelas..." lagi), sementara data terbaru tetap
// diambil diam-diam di belakang layar dari Google Sheets. Ini murni percepatan tampilan --
// sumber data yang sebenarnya tetap Google Sheets, cache cuma disk sementara di browser ini.
const CLASS_CACHE_PREFIX = 'absensi_cache_v1:';
function loadCachedClass(base){
  try{
    const raw = localStorage.getItem(CLASS_CACHE_PREFIX+base);
    return raw ? JSON.parse(raw) : null;
  }catch(e){ return null; }
}
function saveCachedClass(base){
  try{
    localStorage.setItem(CLASS_CACHE_PREFIX+base, JSON.stringify({
      students: state.students, matkul: state.matkul, scans: state.scans,
      rekap: state.rekap, semesterStart: state.semesterStart,
    }));
  }catch(e){ /* localStorage penuh/diblokir -- abaikan, tidak fatal */ }
}

async function loadClass(){
  const base = keyBase();
  const cached = loadCachedClass(base);
  if(cached){
    // Tampilkan dulu data terakhir yang tersimpan di browser ini supaya kelas langsung
    // kelihatan isinya (tidak blank/loading), sambil data terbaru diambil di background.
    state.students = cached.students || [];
    state.matkul = cached.matkul || [];
    normalizeMatkulHari();
    state.scans = cached.scans || [];
    state.rekap = cached.rekap || {};
    state.semesterStart = cached.semesterStart || DEFAULT_SEMESTER_START;
    state.loading = false;
  } else {
    state.loading = true;
  }
  render();
  const [rosterRes, matkul, scans, rekap, semStart] = await batchGetClassData_(base);
  if(base !== keyBase()){
    // Pengguna sudah pindah ke kelas lain sebelum data ini selesai diambil -- buang hasil
    // ini supaya tidak menimpa data kelas yang sedang ditampilkan sekarang.
    return;
  }
  if(rosterRes.found){
    state.students = rosterRes.value;
  } else if(SEED_STUDENTS[base]){
    // first time this class is opened: pre-fill with the official roster provided
    state.students = SEED_STUDENTS[base].map(s=>({id:uid(), nama:s.nama, nim:s.nim}));
    await saveStudents();
  } else {
    state.students = [];
  }
  // Urutkan daftar mahasiswa berdasarkan NIM dari yang terkecil, berlaku untuk semua kelas
  // (baik data lama yang sudah tersimpan maupun data baru dari SEED_STUDENTS).
  state.students.sort((a,b)=> String(a.nim).localeCompare(String(b.nim), undefined, {numeric:true}));
  if(matkul && matkul.length){
    state.matkul = matkul;
    normalizeMatkulHari();
    // CATATAN: Migrasi otomatis (yang dulu menambahkan ulang mata kuliah dari SEED_MATKUL
    // setiap kali kelas dibuka) sudah DIMATIKAN. Dulu ini menyebabkan mata kuliah yang sudah
    // dihapus admin lewat tab "Mata Kuliah" selalu muncul lagi setiap halaman dibuka ulang,
    // karena sistem menganggapnya "belum ada" dan menambahkannya lagi secara otomatis.
    // Sekarang data mata kuliah tersimpan (state.matkul) dipakai apa adanya -- kalau admin
    // menghapus satu mata kuliah, mata kuliah itu akan tetap terhapus permanen.
    //
    // LAPIS PENGAMAN TAMBAHAN: apapun penyebabnya (deploy lama yang masih aktif, submit
    // form dobel, dsb), setiap kali kelas ini dibuka sistem sekarang otomatis mendeteksi
    // & menggabungkan mata kuliah yang namanya PERSIS SAMA jadi 1 entri saja -- hari
    // kuliahnya digabung (union), lalu entri duplikatnya dibuang permanen dan disimpan ulang.
    // Jadi walau ada duplikat baru muncul dari sumber mana pun, begitu kelas dibuka lagi
    // otomatis dirapikan sendiri tanpa perlu hapus manual satu-satu.
    const dedupMap = new Map();
    state.matkul.forEach(m=>{
      const key = m.nama.trim();
      if(!dedupMap.has(key)){
        dedupMap.set(key, {...m, hari:[...(m.hari||[])]});
      } else {
        const existing = dedupMap.get(key);
        (m.hari||[]).forEach(h=>{ if(!existing.hari.includes(h)) existing.hari.push(h); });
        if(!existing.jam && m.jam) existing.jam = m.jam;
      }
    });
    const deduped = Array.from(dedupMap.values());
    if(deduped.length !== state.matkul.length){
      state.matkul = deduped;
      await saveMatkul();
    }
  } else if(SEED_MATKUL[base]){
    // first time this class is opened: pre-fill with the official matkul list (with jam/pertemuan + hari perkiraan)
    state.matkul = SEED_MATKUL[base].map(m=>({id:uid(), nama:m.nama, jam:m.jam, hari: m.hari ? [m.hari] : []}));
    await saveMatkul();
  } else {
    state.matkul = matkul;
    normalizeMatkulHari();
  }
  state.scans = scans;
  state.rekap = rekap;
  if(semStart){
    state.semesterStart = semStart;
  } else {
    // belum pernah diatur untuk kelas ini -> pakai default semester berjalan
    state.semesterStart = DEFAULT_SEMESTER_START;
    await saveSemesterStart();
  }
  state.loading = false;
  saveCachedClass(base);
  render();
}
// Mengambil roster+matkul+scans+rekap+semesterStart untuk 1 kelas dalam SATU kali
// request ke Apps Script (?keys=k1,k2,k3,...), jauh lebih cepat daripada 5 request
// terpisah -- terutama untuk kelas yang baru pertama kali dibuka (belum ada di cache
// browser). Kalau backend lama (belum mendukung ?keys=) masih terpasang, otomatis
// jatuh ke cara lama (5 request terpisah) supaya aplikasi tetap jalan normal.
async function batchGetClassData_(base){
  const keys = ['roster:'+base, 'matkul:'+base, 'scans:'+base, 'rekap:'+base, 'semesterStart:'+base];
  try{
    const res = await fetch(SHEETS_API_URL + '?keys=' + encodeURIComponent(keys.join(',')));
    const r = await res.json();
    if(r && r.values){
      const parse = (k, fallback)=>{
        const entry = r.values[k];
        if(entry && entry.found && entry.value) return { found:true, value: JSON.parse(entry.value) };
        return { found:false, value: fallback };
      };
      const rosterRes = parse(keys[0], []);
      return [
        rosterRes,
        parse(keys[1], []).value,
        parse(keys[2], []).value,
        parse(keys[3], {}).value,
        parse(keys[4], null).value,
      ];
    }
  }catch(e){ console.error('Batch load gagal, jatuh ke cara lama:', e); }
  // Fallback: backend belum mendukung ?keys= (Code.gs belum di-update) atau request batch gagal.
  return Promise.all([
    safeGetRaw(keys[0]),
    safeGet(keys[1], []),
    safeGet(keys[2], []),
    safeGet(keys[3], {}),
    safeGet(keys[4], null),
  ]);
}
async function safeGet(key, fallback){
  const r = await safeGetRaw(key);
  return r.found ? r.value : fallback;
}
async function safeGetRaw(key){
  try{
    const res = await fetch(SHEETS_API_URL + '?key=' + encodeURIComponent(key));
    const r = await res.json();
    if(r && r.found && r.value) return { found:true, value: JSON.parse(r.value) };
    return { found:false, value:null };
  }catch(e){ console.error('Gagal membaca dari Google Sheets:', key, e); return { found:false, value:null }; }
}
async function saveStudents(){
  // Urutkan berdasarkan NIM dari yang terkecil setiap kali data mahasiswa disimpan
  // (tambah manual, hapus, edit, dsb), supaya urutan selalu konsisten.
  state.students.sort((a,b)=> String(a.nim).localeCompare(String(b.nim), undefined, {numeric:true}));
  await safeSet('roster:'+keyBase(), state.students);
  saveCachedClass(keyBase());
}
async function saveMatkul(){ await safeSet('matkul:'+keyBase(), state.matkul); saveCachedClass(keyBase()); }
async function saveScans(){ await safeSet('scans:'+keyBase(), state.scans); saveCachedClass(keyBase()); }
async function saveRekap(){ await safeSet('rekap:'+keyBase(), state.rekap); saveCachedClass(keyBase()); }
async function saveSemesterStart(){ await safeSet('semesterStart:'+keyBase(), state.semesterStart); saveCachedClass(keyBase()); }
// Upload gambar (data URL base64 hasil compressImage) ke Google Drive lewat Apps Script,
// mengembalikan URL gambar tersimpan di Drive. Foto TIDAK lagi disimpan sebagai teks base64
// di Google Sheets, supaya tidak kena batas 50.000 karakter per sel.
// 'logInfo' (opsional): kalau diisi {prodi,kelas,tanggalKuliah,matkul}, backend akan SEKALIGUS
// mencatat baris ke "Log Scan Absensi" dalam request yang SAMA -- supaya notifikasi Admin tidak
// bergantung pada request kedua yang terpisah (yang sebelumnya kadang gagal tanpa alasan jelas).
async function uploadImageToDrive(dataUrl, filename, logInfo){
  const res = await fetch(SHEETS_API_URL, {
    method: 'POST',
    body: JSON.stringify({ action:'uploadImage', dataUrl, filename, log: logInfo || null }),
  });
  const r = await res.json();
  if(window.__DEBUG_NOTIF__) alert('DEBUG uploadImage response: ' + JSON.stringify(r));
  if(!r || !r.ok || !r.url) throw new Error(r && r.error ? r.error : 'Upload gagal');
  return r.url;
}
// Mencatat 1 baris rapi ke sheet "Log Scan Absensi" (Tanggal & Jam Upload, Prodi, Kelas,
// Tanggal Perkuliahan, Mata Kuliah, Link Dokumen) supaya bisa dibaca langsung di spreadsheet
// tanpa perlu buka aplikasi web ini. Dikirim terpisah dari safeSet(scans:...) yang menyimpan
// state internal aplikasi -- kalau logScan gagal, tidak menghentikan proses upload utama.
async function logScanToSheet(payload){
  try{
    const res = await fetch(SHEETS_API_URL, {
      method: 'POST',
      body: JSON.stringify({ action:'logScan', ...payload }),
    });
    const r = await res.json();
    if(window.__DEBUG_NOTIF__) alert('DEBUG logScan sukses: ' + JSON.stringify(r));
    if(!r || !r.ok){
      console.error('logScan ditolak backend:', r);
      if(window.__DEBUG_NOTIF__) alert('DEBUG logScan GAGAL (backend menolak): ' + JSON.stringify(r));
    }
  }catch(e){
    console.error('Gagal mencatat log scan:', e);
    if(window.__DEBUG_NOTIF__) alert('DEBUG logScan GAGAL (network/exception): ' + String(e));
  }
}
async function safeSet(key, value){
  try{
    // Body dikirim sebagai string biasa (bukan header application/json) supaya browser
    // tidak melakukan CORS preflight (OPTIONS) yang tidak didukung Google Apps Script.
    await fetch(SHEETS_API_URL, {
      method: 'POST',
      body: JSON.stringify({ key: key, value: JSON.stringify(value) }),
    });
  }catch(e){
    console.error('Gagal menyimpan ke Google Sheets:', key, e);
    // Data tetap ada di memori (state) walau gagal tersimpan permanen,
    // jadi tampilan tidak boleh berhenti hanya karena ini gagal.
  }
}

function uid(){ return (crypto.randomUUID ? crypto.randomUUID() : 'id-'+Date.now()+'-'+Math.random().toString(16).slice(2)); }

/* ---------------- Notifikasi Admin real-time (upload Ketua Kelas) ---------------- */
// Hanya aktif untuk role Admin. Mengecek berkala (polling) ke Apps Script apakah ada
// baris baru masuk di sheet "Log Scan Absensi" sejak terakhir kali dicek -- lintas
// semua prodi/kelas, supaya Admin tetap dapat notifikasi walau sedang membuka kelas lain.
const ADMIN_NOTIF_POLL_MS = 5000; // cek setiap 5 detik
const ADMIN_NOTIF_HISTORY_HOURS = 24*7; // riwayat notifikasi upload disimpan/ditampilkan sampai 7 hari
const NOTIF_LAST_READ_KEY = 'absensiJtm_notifLastReadAt'; // localStorage: kapan Admin (di PERANGKAT ini) terakhir buka lonceng
let adminNotifTimer = null;
let adminNotifSince = null;

// Waktu terakhir Admin membuka/menandai-baca notifikasi DI PERANGKAT INI, disimpan permanen
// di localStorage (bukan cuma memori) -- supaya upload yang terjadi SEBELUM Admin sempat
// membuka halaman tetap ditandai belum-dibaca (titik merah tetap muncul), bukan otomatis
// dianggap sudah dibaca hanya karena kejadiannya lebih dulu daripada Admin memuat halaman.
function getNotifLastReadAt_(){
  try{
    const v = localStorage.getItem(NOTIF_LAST_READ_KEY);
    return v || null;
  }catch(e){ return null; }
}
function setNotifLastReadAt_(iso){
  try{ localStorage.setItem(NOTIF_LAST_READ_KEY, iso); }catch(e){ /* abaikan kalau localStorage tidak tersedia */ }
}

// PENTING: polling ini SENGAJA tidak lagi dikaitkan dengan tab/role yang sedang tampil di
// layar (dulu berhenti setiap kali pindah dari tampilan Admin ke Ketua Kelas). Selama
// perangkat ini pernah login Admin (adminUnlocked), polling tetap jalan di belakang layar
// walau lagi melihat tampilan Ketua Kelas -- supaya lonceng & riwayat tetap ter-update dan
// toast tetap muncul begitu Admin pindah balik ke tampilan Admin, tanpa perlu login ulang.
function startAdminNotifPolling(){
  if(adminNotifTimer) return; // sudah jalan, tidak perlu mulai lagi
  // Mulai dari beberapa jam ke belakang (bukan dari 'sekarang') supaya upload yang baru saja
  // terjadi -- termasuk sesaat sebelum Admin login -- tetap langsung terlihat begitu dibuka,
  // bukan cuma yang terjadi SETELAH login. Status baca/belum-dibaca-nya sendiri ditentukan
  // dengan membandingkan ke NOTIF_LAST_READ_KEY di localStorage, bukan otomatis "sudah dibaca".
  adminNotifSince = new Date(Date.now() - ADMIN_NOTIF_HISTORY_HOURS*3600*1000).toISOString();
  loadInitialNotifHistory();
  adminNotifTimer = setInterval(pollAdminNotif, ADMIN_NOTIF_POLL_MS);
}
function stopAdminNotifPolling(){
  if(adminNotifTimer){ clearInterval(adminNotifTimer); adminNotifTimer = null; }
}
// Buang notifikasi yang sudah lebih tua dari 7 hari dari daftar riwayat di lonceng, dihitung
// sejak waktu upload-nya masing-masing -- supaya riwayat betul-betul "bertahan 7 hari sejak
// notifikasi awal", bukan cuma dibatasi jumlah item.
function pruneOldNotifications_(){
  const cutoff = Date.now() - ADMIN_NOTIF_HISTORY_HOURS*3600*1000;
  state.notifications = state.notifications.filter(n=> new Date(n.timestamp).getTime() >= cutoff);
}
async function loadInitialNotifHistory(){
  try{
    const res = await fetch(SHEETS_API_URL + '?action=recentScans&since=' + encodeURIComponent(adminNotifSince), { cache:'no-store' });
    if(!res.ok) throw new Error('HTTP ' + res.status + ' dari server');
    const r = await res.json();
    if(window.__DEBUG_NOTIF__) alert('DEBUG loadInitialNotifHistory response: ' + JSON.stringify(r));
    if(r && r.error) throw new Error(String(r.error));
    state.notifError = null;
    if(r && Array.isArray(r.rows) && r.rows.length){
      // Kalau localStorage belum pernah menyimpan apa-apa (pertama kali Admin pakai perangkat
      // ini), anggap semua histori yang ada sekarang sudah "diketahui" -- supaya tidak langsung
      // muncul puluhan notifikasi lama menumpuk begitu pertama kali dipakai. Upload BARU setelah
      // titik ini tetap akan terdeteksi belum-dibaca seperti biasa.
      let lastReadAt = getNotifLastReadAt_();
      if(lastReadAt===null){
        const maxTsAwal = r.rows.reduce((m,row)=> row.timestamp>m ? row.timestamp : m, adminNotifSince);
        lastReadAt = maxTsAwal;
        setNotifLastReadAt_(lastReadAt);
      }
      r.rows.forEach(row=>{
        state.notifications.unshift({
          id: uid(), prodi: row.prodi, kelas: row.kelas, matkul: row.matkul,
          tanggalKuliah: row.tanggalKuliah, timestamp: row.timestamp,
          read: row.timestamp <= lastReadAt, // belum pernah dibuka Admin di perangkat ini -> tetap belum dibaca
        });
      });
      pruneOldNotifications_();
      const maxTs = r.rows.reduce((m,row)=> row.timestamp>m ? row.timestamp : m, adminNotifSince);
      adminNotifSince = maxTs;
    }
    renderNotifBell();
  }catch(e){
    console.error('Gagal memuat histori notifikasi:', e);
    state.notifError = 'Gagal memuat notifikasi: ' + String(e.message || e);
    if(window.__DEBUG_NOTIF__) alert('DEBUG loadInitialNotifHistory GAGAL: ' + String(e));
    renderNotifBell();
  }
}
async function pollAdminNotif(){
  try{
    const res = await fetch(SHEETS_API_URL + '?action=recentScans&since=' + encodeURIComponent(adminNotifSince), { cache:'no-store' });
    if(!res.ok) throw new Error('HTTP ' + res.status + ' dari server');
    const r = await res.json();
    if(window.__DEBUG_NOTIF__) alert('DEBUG pollAdminNotif response: ' + JSON.stringify(r));
    if(r && r.error) throw new Error(String(r.error));
    state.notifError = null;
    if(r && Array.isArray(r.rows) && r.rows.length){
      r.rows.forEach(row=>{
        showAdminUploadToast(row); // popup sementara, langsung terlihat
        state.notifications.unshift({ // masuk ke riwayat/"story" notifikasi di bell
          id: uid(), prodi: row.prodi, kelas: row.kelas, matkul: row.matkul,
          tanggalKuliah: row.tanggalKuliah, timestamp: row.timestamp, read: false,
        });
      });
      pruneOldNotifications_(); // batasi riwayat sampai 7 hari terakhir saja
      const maxTs = r.rows.reduce((m,row)=> row.timestamp>m ? row.timestamp : m, adminNotifSince);
      adminNotifSince = maxTs;
      // TIDAK memajukan NOTIF_LAST_READ_KEY di sini -- notifikasi baru ini harus tetap
      // tampil belum-dibaca (titik merah) sampai Admin benar-benar membuka lonceng.
    }
    renderNotifBell(); // refresh juga teks waktu relatif ("X menit yang lalu") walau tidak ada notif baru
  }catch(e){
    console.error('Gagal cek notifikasi upload baru:', e);
    state.notifError = 'Gagal memuat notifikasi: ' + String(e.message || e);
    if(window.__DEBUG_NOTIF__) alert('DEBUG pollAdminNotif GAGAL: ' + String(e));
    renderNotifBell();
  }
}
// Cari kode singkat prodi (mis. "D3-TME") dari nama lengkap yang tersimpan di sheet
// (mis. "D3 Teknik Mesin"), lalu format spasi supaya jadi "D3 TME" sesuai contoh yang diminta.
function prodiKodeFromNama_(nama){
  const p = PRODI.find(x=>x.nama===nama);
  return p ? p.kode.replace('-', ' ') : nama;
}
// Format teks notifikasi upload jadi satu kalimat rapi, mis. "D3 TME Kelas 1 A mengupload berkas".
// 'kelas' tersimpan sebagai gabungan tanpa spasi (mis. "1A", "2D") -> dipisah jadi "1 A", "2 D".
function notifUploadText_(prodiNama, kelas){
  const kelasSpasi = String(kelas||'').replace(/^(\d+)([A-Za-z]+)$/, '$1 $2');
  return `${prodiKodeFromNama_(prodiNama)} Kelas ${kelasSpasi} mengupload berkas`;
}
function showAdminUploadToast(row){
  const container = document.getElementById('adminToastContainer');
  if(!container) return;
  const el = document.createElement('div');
  el.className = 'admin-toast';
  el.innerHTML = `
    <div class="icon">&#8593;</div>
    <div class="body">
      <div class="title">${escapeHtml(notifUploadText_(row.prodi, row.kelas))}</div>
      <div class="sub">${escapeHtml(row.matkul||'')} &middot; ${escapeHtml(formatDate(row.tanggalKuliah))}</div>
    </div>
    <button class="close" aria-label="Tutup">&times;</button>`;
  el.querySelector('.close').addEventListener('click', ()=> el.remove());
  container.appendChild(el);
  setTimeout(()=>{ if(el.isConnected) el.remove(); }, 5000); // auto-hilang setelah 5 detik
}
// Dipanggil LANGSUNG (tanpa menunggu polling 5 detik) begitu upload di perangkat ini sendiri
// berhasil -- supaya Admin yang baru saja upload langsung lihat toast + titik merah di lonceng,
// tidak tergantung request kedua ke backend yang kadang telat/gagal. Polling (pollAdminNotif)
// tetap jalan seperti biasa untuk menangkap upload dari perangkat/sesi LAIN.
// CATATAN: notifikasi ini HANYA untuk Admin. Kalau yang upload adalah Ketua Kelas di
// perangkat yang bukan Admin, tidak ada toast/lonceng yang muncul sama sekali di perangkat
// itu -- Ketua Kelas cukup tahu uploadnya berhasil lewat tampilan daftar scan seperti biasa.
function notifyLocalUploadSuccess(row){
  if(!state.adminUnlocked) return; // bukan perangkat Admin -> tidak ada notifikasi apapun
  showAdminUploadToast(row);
  state.notifications.unshift({
    id: uid(), prodi: row.prodi, kelas: row.kelas, matkul: row.matkul,
    tanggalKuliah: row.tanggalKuliah, timestamp: row.timestamp, read: false,
  });
  pruneOldNotifications_();
  // Majukan penanda "since" supaya polling berikutnya tidak menampilkan toast kedua
  // untuk upload yang sama begitu backend selesai mencatatnya.
  if(adminNotifSince===null || row.timestamp>adminNotifSince) adminNotifSince = row.timestamp;
  renderNotifBell();
}

/* ---------------- Render ---------------- */
function render(){
  renderRoleSwitch();
  renderNotifBell();
  const app = document.getElementById('app');
  app.innerHTML = `
    ${renderSelector()}
    ${renderTabnav()}
    ${state.loading ? '<div class="panel"><div class="empty-state"><div class="glyph">&#9203;</div><p>Memuat data kelas&hellip;</p></div></div>' : renderTabContent()}
  `;
  attachHandlers();
  renderModal();
}

function renderRoleSwitch(){
  document.getElementById('roleSwitch').innerHTML = `
    <button data-role="admin" class="${state.role==='admin'?'active':''}">Admin</button>
    <button data-role="ketua" class="${state.role==='ketua'?'active':''}">Ketua Kelas</button>
  `;
}

// Bell notifikasi (mirip notifikasi sosmed) -- HANYA tampil untuk role Admin, karena
// notifikasi ini soal upload absensi yang perlu diketahui Admin. Menampilkan daftar
// riwayat notifikasi (state.notifications), titik merah kalau ada yang belum dibaca,
// dan waktu relatif ("2 menit yang lalu") yang dihitung ulang setiap render.
function renderNotifBell(){
  const wrap = document.getElementById('notifBellWrap');
  if(!wrap) return;
  if(state.role!=='admin'){ wrap.innerHTML=''; return; }
  const unreadCount = state.notifications.filter(n=>!n.read).length;
  const list = state.notifications;
  wrap.innerHTML = `
    <button class="notif-bell-btn" id="notifBellBtn" aria-label="Notifikasi">
      &#128276;
      ${unreadCount>0 ? '<span class="notif-bell-dot"></span>' : ''}
    </button>
    ${state.notifPanelOpen ? `
      <div class="notif-panel" id="notifPanel">
        <div class="notif-panel-head">
          <h4>Notifikasi Upload</h4>
          ${unreadCount>0 ? `<button id="notifMarkAllRead">Tandai semua dibaca</button>` : ''}
        </div>
        ${state.notifError ? `<div class="notif-empty" style="color:var(--danger); text-align:left; padding:10px 14px;">&#9888; ${escapeHtml(state.notifError)}</div>` : ''}
        ${list.length ? list.map(n=>`
          <div class="notif-item ${n.read?'':'unread'}">
            <div class="icon">&#8593;</div>
            <div class="body">

// Format waktu relatif ala notifikasi sosmed: "baru saja", "5 menit yang lalu", "2 jam yang lalu", dst.
function timeAgo(isoString){
  const diffMs = Date.now() - new Date(isoString).getTime();
  const diffSec = Math.max(0, Math.floor(diffMs/1000));
  if(diffSec<60) return 'baru saja';
  const diffMin = Math.floor(diffSec/60);
  if(diffMin<60) return diffMin+' menit yang lalu';
  const diffHour = Math.floor(diffMin/60);
  if(diffHour<24) return diffHour+' jam yang lalu';
  const diffDay = Math.floor(diffHour/24);
  return diffDay+' hari yang lalu';
}

// Hitung rekap S/I/A dalam PERTEMUAN dan dalam JAM untuk satu mata kuliah tertentu
function hitungRekapMatkul(matkulId){
  const mk = state.matkul.find(m=>m.id===matkulId);
  const jamPerPertemuan = mk ? (mk.jam||1) : 1;
  // Semua sesi yang seharusnya sudah kuliah sampai hari ini -- termasuk yang belum
  // diupload sama sekali maupun yang sudah discan tapi BELUM direkap admin -- tetap
  // dihitung sebagai 1 pertemuan (default Alpa) supaya tidak hilang dari rekap.
  const dates = mk ? allSessionDatesForMatkul(mk, todayDateCap()) : [];
  const totalPertemuan = dates.length;
  const perStudent = {};
  state.students.forEach(st=>{
    let S=0,I=0,A=0;
    dates.forEach(tanggal=>{
      const sc = state.scans.find(s=>s.matkulId===matkulId && s.tanggal===tanggal);
      if(!sc || !sc.direkap){
        // Belum diupload sama sekali, ATAU sudah diupload tapi admin belum mengisi
        // rekap utk sesi ini -> semua mahasiswa dianggap Alpa dulu.
        A++;
        return;
      }
      const r = state.rekap[sc.id];
      const status = r ? r[st.id] : null;
      if(status==='S') S++;
      else if(status==='I') I++;
      else if(status==='A') A++;
      else A++; // sudah direkap tapi status mahasiswa ini belum ditandai -> anggap Alpa juga
    });
    perStudent[st.id] = {
      S, I, A, jumlahPertemuan: S+I+A,
      Sjam: S*jamPerPertemuan, Ijam: I*jamPerPertemuan, Ajam: A*jamPerPertemuan,
      jumlahJam: (S+I+A)*jamPerPertemuan,
    };
  });
  return { jamPerPertemuan, totalPertemuan, totalJamMatkul: totalPertemuan*jamPerPertemuan, perStudent };
}

// Kategori SP berdasarkan jam Alpa (A) kumulatif, sesuai aturan jurusan
function spKeterangan(aJam){
  if(aJam<15) return 'OK PA';
  if(aJam<30) return 'SP-1, Konsultasi dgn PA';
  if(aJam<45) return 'SP-2, Konsultasi dgn PA';
  if(aJam<76) return 'SP-3, Konsultasi/Pemanggilan Orang Tua';
  return 'Tidak Dapat Melanjutkan Perkuliahan';
}

  if(!state.students.length || !state.matkul.length){

  const weekPanel = renderWeeklyRecap();

  // ---- Tabel total gabungan semua mata kuliah (dalam jam) ----
  const rekapSemua = state.matkul.map(m=>hitungRekapMatkul(m.id));
  const totalJamSemuaMatkul = rekapSemua.reduce((a,r)=>a+r.totalJamMatkul,0);
  const totalRows = state.students.map((st,i)=>{
    let S=0,I=0,A=0;
    rekapSemua.forEach(r=>{
      const d = r.perStudent[st.id];
      S += d.Sjam; I += d.Ijam; A += d.Ajam;
    });
    const jumlah = S+I+A;
    const pktos = 0;
    const komp = I*1 + A*2 + pktos;
    return `<tr>
      <td class="mono" style="text-align:center;">${i+1}</td>
      <td class="nim" style="text-align:center;">${escapeHtml(st.nim)}</td>
      <td>${escapeHtml(st.nama)}</td>
      <td class="mono col-s" style="text-align:center;">${S}</td>

      <td class="mono col-a" style="text-align:center;">${A}</td>
      <td class="mono col-jumlah" style="text-align:center;">${jumlah}</td>
      <td class="mono" style="text-align:center;">${pktos}</td>
      <td class="mono col-komp" style="text-align:center;">${komp}</td>
    </tr>`;
  }).join('');

  return weekPanel + `

// ---- Panel "Rekap per Minggu" (tampil di layar, format sama seperti export Excel) ----
function renderWeeklyRecap(){
  if(!state.semesterStart){
    return `<div class="panel">
      <div class="panel-head"><div><h2>Rekap Absensi per Minggu &mdash; Kelas ${state.kelas}</h2></div></div>
      <div class="note">Atur <strong>Tanggal Mulai Semester</strong> dulu di tab "Mata Kuliah" supaya rekap mingguan bisa ditampilkan.</div>
    </div>`;
  }
  if(!state.summaryWeek || state.summaryWeek<1 || state.summaryWeek>TOTAL_WEEKS){
    state.summaryWeek = 1;
  }
  const week = state.summaryWeek;
  const monday = weekMondayOf(week, state.semesterStart);
  const saturday = addDaysDate(monday, 5);
  const prevSaturday = addDaysDate(monday, -2);

  const matkulByHari = {};
  DAYS_ID.forEach(d=> matkulByHari[d] = state.matkul.filter(m=>hariArrayOf(m).includes(d)));
  const adaJadwal = state.matkul.some(m=>hariArrayOf(m).length);

  const weekOptions = Array.from({length:TOTAL_WEEKS}, (_,i)=>i+1).map(w=>{
    const mon = weekMondayOf(w, state.semesterStart);
    const sat = addDaysDate(mon,5);
    return `<option value="${w}" ${w===week?'selected':''}>Minggu ${w} (${fmtDDMMYYYY(mon)} &ndash; ${fmtDDMMYYYY(sat)})</option>`;
  }).join('');

  // Header hari + matkul (colspan per hari = 3 x jumlah matkul hari itu)
  // 3 tingkat header: (1) hari+tanggal, (2) nama matkul, (3) S/I/A per matkul — supaya sejajar dengan body
  // Semua 6 hari (Senin s/d Sabtu) SELALU ditampilkan; hari tanpa mata kuliah tetap punya 1 kolom
  // placeholder supaya tabel konsisten memuat penuh sampai Sabtu.
  let dayHeaderCells = '', matkulSubHeaderCells = '', matkulSIACells = '';
  let jumlahMatkulTampil = 0, jumlahHariKosong = 0;
  DAYS_ID.forEach((day,dIdx)=>{
    const list = matkulByHari[day];
    const dateForDay = addDaysDate(monday, dIdx);
    if(!list.length){
      jumlahHariKosong++;
      dayHeaderCells += `<th colspan="1">${day}, ${fmtDDMMYYYY(dateForDay)}</th>`;
      matkulSubHeaderCells += `<th rowspan="2" style="font-weight:400; color:var(--ink-soft);">&mdash;<br><span style="font-size:9px;">tidak ada jadwal</span></th>`;
      return;
    }
    dayHeaderCells += `<th colspan="${list.length*3}">${day}, ${fmtDDMMYYYY(dateForDay)}</th>`;
    list.forEach(mk=>{
      jumlahMatkulTampil++;
      matkulSubHeaderCells += `<th colspan="3" style="font-weight:600;">${escapeHtml(mk.nama)}<br><span class="mono" style="font-weight:400;">${mk.jam||1}j</span></th>`;
      matkulSIACells += `<th style="font-weight:500;">S</th><th style="font-weight:500;">I</th><th style="font-weight:500;">A</th>`;
    });
  });

  // Colgroup: setiap kolom S/I/A (total maupun per mata kuliah) diberi bobot lebar yang SAMA,
  // supaya semua kolom simetris dan tabel selalu pas dalam 1 layar tanpa perlu digeser ke samping.
  const W = { no:30, bp:70, nama:120, jam:42, pktos:34, komp:50, ket:58, sia:24, siaSum:34, kosong:46 };
  let colgroupHtml = `<col style="width:${W.no}px;"><col style="width:${W.bp}px;"><col style="width:${W.nama}px;">`;
  colgroupHtml += `<col style="width:${W.siaSum}px;"><col style="width:${W.siaSum}px;"><col style="width:${W.siaSum}px;">`;
  colgroupHtml += `<col style="width:${W.jam}px;"><col style="width:${W.pktos}px;"><col style="width:${W.komp}px;">`;
  DAYS_ID.forEach(day=>{
    const list = matkulByHari[day];
    if(!list.length){
      colgroupHtml += `<col style="width:${W.kosong}px;">`;
      return;
    }
    list.forEach(()=>{
      colgroupHtml += `<col style="width:${W.sia}px;"><col style="width:${W.sia}px;"><col style="width:${W.sia}px;">`;
    });
  });
  colgroupHtml += `<col style="width:${W.ket}px;">`;

  const rows = state.students.map((st,i)=>{
    let dayCells = '';
    DAYS_ID.forEach((day,dIdx)=>{
      const list = matkulByHari[day];
      if(!list.length){
        dayCells += `<td class="mono" style="color:var(--ink-soft);">&mdash;</td>`;
        return;
      }
      const dateForDay = toISO(addDaysDate(monday, dIdx));
      list.forEach(mk=>{
        const { S:wS, I:wI, A:wA } = sessionStatusForDate(mk, dateForDay, st.id);
        dayCells += `<td class="mono sia-cell">${wS||''}</td><td class="mono sia-cell">${wI||''}</td><td class="mono sia-cell">${wA||''}</td>`;
      });
    });
    const total = state.matkul.reduce((acc,mk)=>{
      const c = cumulativeSIA(saturday, mk.id, st.id);
      acc.S+=c.S; acc.I+=c.I; acc.A+=c.A;
      return acc;
    },{S:0,I:0,A:0});
    const jumlahJam = total.S+total.I+total.A;
    const pktos = 0;
    const komp = total.I*1 + total.A*2 + pktos;
    const ket = spKeterangan(total.A);
    return `<tr>
      <td class="mono">${i+1}</td>
      <td class="nim">${escapeHtml(st.nim)}</td>
      <td>${escapeHtml(st.nama)}</td>
      <td class="mono sia-cell">${total.S}</td>
      <td class="mono sia-cell">${total.I}</td>
      <td class="mono sia-cell">${total.A}</td>
      <td class="mono" style="font-weight:700;">${jumlahJam}</td>
      <td class="mono">${pktos}</td>
      <td class="mono" style="font-weight:700;">${komp}</td>
      ${dayCells}
      <td class="ket-cell">${escapeHtml(ket)}</td>
    </tr>`;
  }).join('');

  return `
  <div class="panel">
    <div class="panel-head">
      <div>
        <h2>Rekap Absensi per Minggu &mdash; Kelas ${state.kelas}</h2>
        <p>Kolom JUMLAH/PKTOS/KOMPENSASI/KETERANGAN dihitung <strong>kumulatif sejak awal semester</strong> sampai akhir minggu terpilih. Kolom per mata kuliah menampilkan catatan minggu itu saja.</p>
      </div>
    </div>
    <div class="field" style="max-width:340px; margin-bottom:14px;">
      <label>Minggu</label>
      <select id="summaryWeekSelect">${weekOptions}</select>
    </div>
    ${!adaJadwal ? `<div class="note">Belum ada mata kuliah yang diatur "Hari"-nya di tab "Mata Kuliah" &mdash; kolom per mata kuliah belum bisa ditampilkan.</div>` : ''}
    <div style="margin-bottom:14px; display:flex; align-items:center; gap:10px; flex-wrap:wrap;">
      <button class="btn btn-ghost btn-sm" id="exportWeekExcelBtn" ${!state.students.length ? 'disabled' : ''}>&#8595; Download Excel (Minggu ${week} ini)</button>
      <div style="display:flex; align-items:center; gap:4px; border:1px solid var(--line-strong); border-radius:8px; padding:2px;">
        <button class="btn btn-ghost btn-sm" id="rekapZoomOut" title="Perkecil tampilan tabel" style="padding:4px 10px;">&minus;</button>
        <span class="mono" id="rekapZoomLabel" style="font-size:12px; min-width:42px; text-align:center;">${Math.round((state.rekapZoom||1)*100)}%</span>
        <button class="btn btn-ghost btn-sm" id="rekapZoomIn" title="Perbesar tampilan tabel" style="padding:4px 10px;">&plus;</button>
        <button class="btn btn-ghost btn-sm" id="rekapZoomReset" title="Kembalikan ke ukuran normal" style="padding:4px 10px; font-size:11px;">Reset</button>
      </div>
    </div>
    <div class="excel-table-scroll">
      <div id="rekapZoomWrap" style="zoom:${state.rekapZoom||1};">
      <table class="excel-table excel-table--fit">
        <colgroup>${colgroupHtml}</colgroup>
        <thead>
          <tr>
            <th rowspan="3">No</th>
            <th rowspan="3">BP</th>
            <th rowspan="3">NAMA</th>
            <th colspan="3">JUMLAH</th>
            <th rowspan="3">JUMLAH<br>JAM</th>
            <th rowspan="3">PKTOS</th>
            <th rowspan="3">JUMLAH<br>KOMPENSASI</th>
            ${dayHeaderCells}
            <th rowspan="3">KETERANGAN</th>
          </tr>
          <tr>
            <th rowspan="2" class="sia-cell">S</th><th rowspan="2" class="sia-cell">I</th><th rowspan="2" class="sia-cell">A</th>
            ${matkulSubHeaderCells}
          </tr>
          <tr>
            ${matkulSIACells}
          </tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>
      </div>
    </div>
  </div>`;
}

// Level zoom foto scan absensi disimpan per-scan (key: scan id) supaya kalau modal
// dibuka-tutup untuk scan yang sama, level zoom terakhir masih diingat -- tapi reset
// otomatis kalau halaman di-reload (murni disimpan di memori, tidak perlu disimpan
// ke server).
const imgZoomLevels = {};
function renderZoomableImage(dataUrl, alt, uid){
  const z = imgZoomLevels[uid] || 1;
  return `
    <div class="img-zoom-controls">
      <button type="button" class="btn btn-ghost btn-sm" data-img-zoom-out="${uid}" title="Perkecil foto" style="padding:4px 10px;">&minus;</button>
      <span class="mono zoom-label" id="imgZoomLabel_${uid}">${Math.round(z*100)}%</span>
      <button type="button" class="btn btn-ghost btn-sm" data-img-zoom-in="${uid}" title="Perbesar foto" style="padding:4px 10px;">&plus;</button>
      <button type="button" class="btn btn-ghost btn-sm" data-img-zoom-reset="${uid}" title="Ukuran normal" style="padding:4px 10px; font-size:11px;">Reset</button>
      <span class="note" style="margin:0 0 0 4px;">Cubit (pinch) atau klik dobel foto untuk zoom</span>
    </div>
    <div class="img-zoom-viewport" id="imgZoomViewport_${uid}">
      <img class="full img-zoom-target" id="imgZoomTarget_${uid}" src="${dataUrl}" alt="${escapeHtml(alt)}" style="zoom:${z};">
    </div>`;
}
function applyImgZoom(uid){
  const z = imgZoomLevels[uid] || 1;
  const img = document.getElementById('imgZoomTarget_'+uid);
  const label = document.getElementById('imgZoomLabel_'+uid);
  if(img) img.style.zoom = z;
  if(label) label.textContent = Math.round(z*100)+'%';
}
function attachImgZoomHandlers(root, uid){
  const setZoom = (z)=>{ imgZoomLevels[uid] = Math.max(1, Math.min(4, Math.round(z*10)/10)); applyImgZoom(uid); };
  const btnOut = root.querySelector(`[data-img-zoom-out="${uid}"]`);
  if(btnOut) btnOut.addEventListener('click', ()=> setZoom((imgZoomLevels[uid]||1)-0.25));
  const btnIn = root.querySelector(`[data-img-zoom-in="${uid}"]`);
  if(btnIn) btnIn.addEventListener('click', ()=> setZoom((imgZoomLevels[uid]||1)+0.25));
  const btnReset = root.querySelector(`[data-img-zoom-reset="${uid}"]`);
  if(btnReset) btnReset.addEventListener('click', ()=> setZoom(1));
  const img = root.querySelector('#imgZoomTarget_'+uid);
  if(img){
    // Klik dobel (atau tap dobel di HP) untuk cepat perbesar/kembali normal.
    img.addEventListener('dblclick', ()=> setZoom((imgZoomLevels[uid]||1)>1 ? 1 : 2));
  }
}

                <button type="submit" class="btn btn-primary">Buka</button>
              </div>
            </form>
          </div>

    const pinForm = document.getElementById('ketuaUploadPinForm');

/* ---------------- Handlers ---------------- */
function attachHandlers(){
  document.querySelectorAll('[data-role]').forEach(b=> b.addEventListener('click', ()=>{
    const target = b.dataset.role;
    if(target==='admin' && state.role!=='admin'){
      if(state.adminUnlocked){
        // PIN sudah pernah benar di sesi ini -> langsung masuk tanpa minta PIN lagi.
        state.role = 'admin';
        startAdminNotifPolling();
        render();
        return;
      }
      // Mode Admin dikunci PIN lewat modal (bukan window.prompt, karena beberapa
      // lingkungan preview/iframe memblokir dialog prompt() bawaan browser).
      state.modal = { type:'adminPin' };
      renderModal();
      return;
    }
    state.role = target;
    // CATATAN: polling notifikasi TIDAK dihentikan lagi di sini walau pindah ke tampilan
    // Ketua Kelas -- dulu dihentikan setiap kali pindah, sehingga perangkat Admin yang
    // sesekali melihat tampilan Ketua jadi kehilangan notifikasi upload di belakang layar.
    // Selama perangkat ini masih adminUnlocked, polling tetap jalan (lihat startAdminNotifPolling).
    render();
  }));
  document.querySelectorAll('[data-open-ketua-upload-pin]').forEach(b=> b.addEventListener('click', ()=>{
    state.modal = { type:'ketuaUploadPin' };
    renderModal();
  }));
  document.querySelectorAll('[data-prodi]').forEach(b=> b.addEventListener('click', ()=>{
    state.prodi = b.dataset.prodi;
    state.kelas = currentProdi().kelas[0];
    loadClass();
  }));
  document.querySelectorAll('[data-kelas]').forEach(b=> b.addEventListener('click', ()=>{ state.kelas=b.dataset.kelas; loadClass(); }));
  document.querySelectorAll('[data-tab]').forEach(b=> b.addEventListener('click', ()=>{ state.tab=b.dataset.tab; render(); }));

  const addStudentForm = document.getElementById('addStudentForm');
  if(addStudentForm) addStudentForm.addEventListener('submit', (e)=>{
    e.preventDefault();
    const fd = new FormData(addStudentForm);
    const nama = fd.get('nama').trim(), nim = fd.get('nim').trim();
    if(!nama||!nim) return;

/* ---------------- Export Excel (format resmi mingguan) ---------------- */
const DAYS_ID = ['Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
const TOTAL_WEEKS = 18;
const DEFAULT_SEMESTER_START = '2026-08-31'; // Senin minggu pertama, default semester ini

function parseISODate(s){ return new Date(s+'T00:00:00'); }
function addDaysDate(d,n){ const r=new Date(d); r.setDate(r.getDate()+n); return r; }
function getMondayOf(d){ const day=d.getDay(); const diff=(day===0?-6:1-day); return addDaysDate(d,diff); }
function fmtDDMMYYYY(d){
  const dd=String(d.getDate()).padStart(2,'0'), mm=String(d.getMonth()+1).padStart(2,'0'), yyyy=d.getFullYear();
  return `${dd}/${mm}/${yyyy}`;
}
// Format tanggal lokal (bukan UTC) jadi 'YYYY-MM-DD' -- dipakai untuk dicocokkan dengan
// sc.tanggal (string 'YYYY-MM-DD' dari input <input type="date">).
function toISO(d){
  const yyyy=d.getFullYear(), mm=String(d.getMonth()+1).padStart(2,'0'), dd=String(d.getDate()).padStart(2,'0');
  return `${yyyy}-${mm}-${dd}`;
}
function todayDateCap(){ const t=new Date(); t.setHours(0,0,0,0); return t; }
// Nama hari (Senin-Sabtu) dari sebuah objek Date, atau null kalau hari Minggu (tidak
// pernah dianggap hari kuliah di sistem ini).
function dayNameOfDate(d){
  const map = {1:'Senin',2:'Selasa',3:'Rabu',4:'Kamis',5:'Jumat',6:'Sabtu'};
  return map[d.getDay()] || null;
}
// SISTEM ALFA OTOMATIS: menghasilkan semua tanggal pertemuan yang SEHARUSNYA sudah terjadi
// untuk 1 matkul, berdasarkan jadwal hari kuliahnya (mk.hari) dan Tanggal Mulai Semester,
// dibatasi sampai HARI INI (tidak pernah menghasilkan tanggal di masa depan yang belum
// terjadi). Dipakai supaya sesi yang seharusnya sudah kuliah tapi belum ada scan absensi
// sama sekali tetap dihitung Alpa, bukan hilang begitu saja dari rekap.
function expectedSessionDatesForMatkul(mk, uptoDate){
  if(!state.semesterStart) return [];
  const hariSet = hariArrayOf(mk);
  if(!hariSet.length) return [];
  const start = getMondayOf(parseISODate(state.semesterStart));
  const cap = uptoDate < todayDateCap() ? uptoDate : todayDateCap();
  const dates = [];
  for(let d=new Date(start); d<=cap; d=addDaysDate(d,1)){
    const dn = dayNameOfDate(d);
    if(dn && hariSet.includes(dn)) dates.push(toISO(d));
  }
  return dates;
}
// Gabungan semua tanggal pertemuan untuk 1 matkul sampai uptoDate: tanggal terjadwal
// (expectedSessionDatesForMatkul) DIGABUNG dengan tanggal scan yang benar-benar ada
// (jaga-jaga kalau ada scan di luar jadwal, mis. kuliah pengganti) -- supaya scan itu
// tetap terhitung, bukan malah hilang.
function allSessionDatesForMatkul(mk, uptoDate){
  const set = new Set(expectedSessionDatesForMatkul(mk, uptoDate));
  state.scans.forEach(sc=>{
    if(sc.matkulId===mk.id && parseISODate(sc.tanggal) <= uptoDate) set.add(sc.tanggal);
  });
  return Array.from(set).sort();
}
// Daftar semua sesi yang SEHARUSNYA sudah kuliah (sampai hari ini) tapi BELUM ada scan
// sama sekali -- dipakai untuk banner peringatan di tab Upload supaya Ketua Kelas tahu
// persis sesi mana yang harus segera diupload sebelum otomatis tercatat Alpa.
function missingUploadSessions(){
  if(!state.semesterStart) return [];
  const cap = todayDateCap();
  const missing = [];
  state.matkul.forEach(mk=>{
    expectedSessionDatesForMatkul(mk, cap).forEach(tanggal=>{
      const ada = state.scans.some(s=>s.matkulId===mk.id && s.tanggal===tanggal);
      if(!ada) missing.push({ matkulId:mk.id, matkulNama:mk.nama, tanggal });
    });
  });
  missing.sort((a,b)=> a.tanggal.localeCompare(b.tanggal));
  return missing;
}
function weekIndexForDate(dateStr, semesterStartStr){
  if(!semesterStartStr) return null;
  const start = getMondayOf(parseISODate(semesterStartStr));
  const d = getMondayOf(parseISODate(dateStr));
  const diffDays = Math.round((d-start)/(1000*60*60*24));
  const wk = Math.floor(diffDays/7)+1;
  return wk>=1 ? wk : null;
}
function weekMondayOf(weekNum, semesterStartStr){
  const start = getMondayOf(parseISODate(semesterStartStr));
  return addDaysDate(start, (weekNum-1)*7);
}

// Total S/I/A dalam JAM untuk 1 matkul + 1 mahasiswa, akumulasi dari SEMUA sesi yang
// seharusnya sudah kuliah sampai uptoDate (inklusif) -- baik yang sudah ada scan maupun
// yang BELUM diupload sama sekali. Sesi yang belum diupload, atau sudah diupload tapi
// belum direkap admin, dihitung sebagai Alpa (A) dulu untuk SEMUA mahasiswa -- begitu
// discan lalu admin mengisi rekap dan mahasiswa tsb ternyata Hadir/Izin/Sakit, tanda
// Alpa-nya otomatis hilang dan berganti sesuai status yang diinput.
// Status S/I/A untuk 1 matkul + 1 mahasiswa pada SATU tanggal spesifik saja (bukan
// akumulasi 1 minggu). Dipakai di tabel Rekap Mingguan supaya matkul yang jadwalnya
// lebih dari 1 hari per minggu (mis. Senin & Selasa) tidak menampilkan angka total
// mingguan yang sama di kedua kolom hari -- tiap kolom hari sekarang murni menunjukkan
// status pada tanggal kolom itu saja. Tanggal yang belum terjadi (masih di masa depan)
// selalu dianggap kosong (belum ada sesi), bukan Alpa.
function sessionStatusForDate(mk, dateStr, studentId){
  const jam = mk.jam||1;
  const d = parseISODate(dateStr);
  const dn = dayNameOfDate(d);
  const terjadwalHariItu = dn && hariArrayOf(mk).includes(dn);
  const sc = state.scans.find(s=>s.matkulId===mk.id && s.tanggal===dateStr);
  const sudahLewat = d <= todayDateCap();
  if(!terjadwalHariItu && !sc) return {S:0,I:0,A:0}; // tidak ada sesi sama sekali tanggal ini
  if(!sudahLewat && !sc) return {S:0,I:0,A:0}; // tanggal belum terjadi & belum ada scan -> kosong, bukan Alpa
  if(!sc || !sc.direkap){
    // Sesi seharusnya sudah terjadi tapi belum ada scan, atau sudah discan tapi admin
    // belum isi rekap -> default Alpa (hanya kalau tanggalnya sudah lewat/hari ini).
    return sudahLewat ? {S:0,I:0,A:jam} : {S:0,I:0,A:0};
  }
  const r = state.rekap[sc.id];
  const status = r ? r[studentId] : null;
  if(status==='S') return {S:jam,I:0,A:0};
  if(status==='I') return {S:0,I:jam,A:0};
  return {S:0,I:0,A:jam}; // status 'A' atau belum ditandai admin -> Alpa
}
function cumulativeSIA(uptoDate, matkulId, studentId){
  let S=0,I=0,A=0;
  const mk = state.matkul.find(m=>m.id===matkulId);
  if(!mk) return {S,I,A};
  const jam = mk.jam||1;
  allSessionDatesForMatkul(mk, uptoDate).forEach(tanggal=>{
    const sc = state.scans.find(s=>s.matkulId===matkulId && s.tanggal===tanggal);
    if(!sc || !sc.direkap){
      // Belum diupload sama sekali, ATAU sudah diupload tapi admin belum mengisi rekap
      // -> default Alpa dulu.
      A += jam;
      return;
    }
    const r = state.rekap[sc.id];
    const status = r ? r[studentId] : null;
    if(status==='S') S+=jam;
    else if(status==='I') I+=jam;
    else if(status==='A') A+=jam;
    else A+=jam; // sudah direkap tapi status mahasiswa ini belum ditandai -> anggap Alpa juga
  });
  return {S,I,A};
}

function exportOfficialExcel(){
  if(typeof XLSX==='undefined'){ alert('Modul Excel belum siap, coba lagi sesaat.'); return; }
  if(!state.semesterStart){ alert('Atur Tanggal Mulai Semester dulu di tab Mata Kuliah.'); return; }
  if(!state.students.length){ alert('Belum ada data mahasiswa.'); return; }

  const { data, merges } = buildRekapMingguanBlocks_(Array.from({length:TOTAL_WEEKS}, (_,i)=>i+1));

  const ws = XLSX.utils.aoa_to_sheet(data);
  ws['!merges'] = merges;
  ws['!cols'] = [{wch:2},{wch:5},{wch:14},{wch:26},{wch:8},{wch:8},{wch:8},{wch:10},{wch:10},{wch:12}];
  const wb = XLSX.utils.book_new();
  const sheetName = (state.kelas||'Kelas').slice(0,31);
  XLSX.utils.book_append_sheet(wb, ws, sheetName);
  const fname = `Rekap_Absensi_${state.prodi}_${state.kelas}.xlsx`;
  XLSX.writeFile(wb, fname);
}

// Download Excel untuk SATU minggu saja -- persis dengan tabel "Rekap Absensi per Minggu"
// yang sedang tampil di layar (minggu yang lagi dipilih di dropdown).
function exportWeeklyExcelOne_(){
  if(typeof XLSX==='undefined'){ alert('Modul Excel belum siap, coba lagi sesaat.'); return; }
  if(!state.semesterStart){ alert('Atur Tanggal Mulai Semester dulu di tab Mata Kuliah.'); return; }
  if(!state.students.length){ alert('Belum ada data mahasiswa.'); return; }

// Membangun baris-baris (aoa) + merge cell untuk 1 atau beberapa blok minggu, format resmi
// rekapitulasi absensi jurusan. Dipakai bersama oleh exportOfficialExcel (semua minggu) dan
// exportWeeklyExcelOne_ (1 minggu saja, sesuai yang sedang dipilih di layar).
function buildRekapMingguanBlocks_(weekNumbers){
  const matkulByHari = {};
  DAYS_ID.forEach(d=> matkulByHari[d] = state.matkul.filter(m=>hariArrayOf(m).includes(d)));

  const colNO=1, colBP=2, colNAMA=3, colS=4, colI=5, colA=6, colJUMLAH=7, colPKTOS=8, colKOMP=9, colStart=10;
  const data = [];
  const merges = [];
  function setCell(r,c,v){ while(data.length<=r) data.push([]); data[r][c]=v; }
  function mergeRange(r1,c1,r2,c2){ if(r1===r2 && c1===c2) return; merges.push({s:{r:r1,c:c1},e:{r:r2,c:c2}}); }

  let row = 0;
  weekNumbers.forEach(week=>{
    const monday = weekMondayOf(week, state.semesterStart);
    const saturday = addDaysDate(monday, 5); // Sabtu = akhir minggu kuliah (Senin-Sabtu)
    const prevSaturday = addDaysDate(monday, -2); // Sabtu minggu sebelumnya

    const rTitle=row, rJurusan=row+1, rProdi=row+2, rKelas=row+3, rHead=row+4, rSub=row+5, rJam=row+6, rSIA=row+7;

    setCell(rTitle,colBP,'REKAPITULASI ABSENSI MAHASISWA');
    setCell(rTitle,colStart,'MINGGU - '+week);
    setCell(rJurusan,colBP,'JURUSAN TEKNIK MESIN');
    setCell(rProdi,colBP,'PROGRAM STUDI '+(currentProdi()?currentProdi().nama.toUpperCase():''));
    setCell(rKelas,6,'KELAS : '+state.kelas);

    setCell(rHead,colNO,'NO'); mergeRange(rHead,colNO,rSIA,colNO);
    setCell(rHead,colBP,'BP'); mergeRange(rHead,colBP,rSIA,colBP);
    setCell(rHead,colNAMA,'NAMA'); mergeRange(rHead,colNAMA,rSIA,colNAMA);
    setCell(rHead,colS,'JUMLAH'); mergeRange(rHead,colS,rHead,colA);
    setCell(rHead,colJUMLAH,'JUMLAH S+I+A (Jam)'); mergeRange(rHead,colJUMLAH,rSIA,colJUMLAH);
    setCell(rHead,colPKTOS,'PKTOS (Jam)'); mergeRange(rHead,colPKTOS,rSIA,colPKTOS);
    setCell(rHead,colKOMP,'JUMLAH KOMPENSASI {(Sx0)+(Ix1)+(Ax2)+PKTOS}'); mergeRange(rHead,colKOMP,rSIA,colKOMP);
    setCell(rSub,colS,'S (Jam)'); setCell(rSub,colI,'I (Jam)'); setCell(rSub,colA,'A (Jam)');

    let col = colStart;
    DAYS_ID.forEach((day,dIdx)=>{
      const list = matkulByHari[day];
      if(!list.length) return;
      const dayStartCol = col;
      const dateForDay = addDaysDate(monday, dIdx);
      list.forEach(mk=>{
        setCell(rSub,col,mk.nama); mergeRange(rSub,col,rSub,col+2);
        setCell(rJam,col,(mk.jam||1)+' jam'); mergeRange(rJam,col,rJam,col+2);
        setCell(rSIA,col,'S'); setCell(rSIA,col+1,'I'); setCell(rSIA,col+2,'A');
        col+=3;
      });
      setCell(rHead,dayStartCol, day+', '+fmtDDMMYYYY(dateForDay));
      mergeRange(rHead,dayStartCol,rHead,col-1);
    });
    const ketCol = col;
    setCell(rHead,ketCol,'KET.'); mergeRange(rHead,ketCol,rSIA,ketCol);

    let r = rSIA+1;
    state.students.forEach((st,i)=>{
      setCell(r,colNO,i+1);
      setCell(r,colBP,st.nim);
      setCell(r,colNAMA,st.nama);
      let c2 = colStart;
      DAYS_ID.forEach((day,dIdx)=>{
        const dateForDay = toISO(addDaysDate(monday, dIdx));
        matkulByHari[day].forEach(mk=>{
          const { S:wS, I:wI, A:wA } = sessionStatusForDate(mk, dateForDay, st.id);
          if(wS) setCell(r,c2,wS);
          if(wI) setCell(r,c2+1,wI);
          if(wA) setCell(r,c2+2,wA);
          c2+=3;
        });
      });
      const total = state.matkul.reduce((acc,mk)=>{
        const c = cumulativeSIA(saturday, mk.id, st.id);
        acc.S+=c.S; acc.I+=c.I; acc.A+=c.A;
        return acc;
      },{S:0,I:0,A:0});
      setCell(r,colS,total.S); setCell(r,colI,total.I); setCell(r,colA,total.A);
      setCell(r,colJUMLAH,total.S+total.I+total.A);
      setCell(r,colPKTOS,0);
      setCell(r,colKOMP, total.I*1 + total.A*2 + 0);
      setCell(r,ketCol, spKeterangan(total.A));
      r++;
    });

    row = r+2; // spasi sebelum blok minggu berikutnya
  });

  return { data, merges };
}

// Download Excel untuk tabel "Rekap Total Gabungan Semua Mata Kuliah" -- persis dengan
// yang tampil di layar: No, BP, Nama, Total Jam S/I/A, Jumlah Jam, PKTOS, Jumlah Kompensasi.
function exportTotalRecapExcel(){
  if(typeof XLSX==='undefined'){ alert('Modul Excel belum siap, coba lagi sesaat.'); return; }
  if(!state.students.length || !state.matkul.length){ alert('Lengkapi data mahasiswa dan mata kuliah terlebih dahulu.'); return; }

  const rekapSemua = state.matkul.map(m=>hitungRekapMatkul(m.id));
  const data = [
    ['REKAP TOTAL GABUNGAN SEMUA MATA KULIAH'],
    ['JURUSAN TEKNIK MESIN'],
    ['PROGRAM STUDI ' + (currentProdi()?currentProdi().nama.toUpperCase():'')],
    ['KELAS : ' + state.kelas],
    [],
    ['No','BP','NAMA','S (Jam)','I (Jam)','A (Jam)','JUMLAH JAM','PKTOS','JUMLAH KOMPENSASI'],
  ];
  state.students.forEach((st,i)=>{
    let S=0,I=0,A=0;
    rekapSemua.forEach(r=>{
      const d = r.perStudent[st.id];
      S += d.Sjam; I += d.Ijam; A += d.Ajam;
    });
    const jumlah = S+I+A;
    const pktos = 0;
    const komp = I*1 + A*2 + pktos;
    data.push([i+1, st.nim, st.nama, S, I, A, jumlah, pktos, komp]);
  });

  const ws = XLSX.utils.aoa_to_sheet(data);
  ws['!merges'] = [
    {s:{r:0,c:0}, e:{r:0,c:8}},
    {s:{r:1,c:0}, e:{r:1,c:8}},
    {s:{r:2,c:0}, e:{r:2,c:8}},
    {s:{r:3,c:0}, e:{r:3,c:8}},
  ];
  ws['!cols'] = [{wch:4},{wch:14},{wch:28},{wch:10},{wch:10},{wch:10},{wch:12},{wch:8},{wch:16}];
  const wb = XLSX.utils.book_new();
  const sheetName = 'Rekap Total';
  XLSX.utils.book_append_sheet(wb, ws, sheetName);
  const fname = `Rekap_Total_${state.prodi}_${state.kelas}.xlsx`;
  XLSX.writeFile(wb, fname);
}

/* ---------------- Utils ---------------- */
function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function todayStr(){ return new Date().toISOString().slice(0,10); }
function formatDate(d){
  const dt = new Date(d+'T00:00:00');
  return dt.toLocaleDateString('id-ID', {day:'2-digit', month:'short', year:'numeric'});
}
function compressImage(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      const img = new Image();
      img.onload = ()=>{
        const maxDim = 1200;
        let w = img.width, h = img.height;
        if(w>maxDim || h>maxDim){
          if(w>h){ h = Math.round(h*maxDim/w); w = maxDim; }
          else { w = Math.round(w*maxDim/h); h = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#fff'; ctx.fillRect(0,0,w,h);
        ctx.drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', 0.72));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
