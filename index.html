    --bg:#EEF2F4;
    --paper:#F7F9FA;
    --surface:#FFFFFF;
    --ink:#0F2340;
    --ink-soft:#4C5C72;
    --primary:#1F3A63;
    --primary-light:#2C5490;
    --accent:#E8871E;
    --accent-ink:#7A4506;
    --danger:#B23A2E;
    --success:#2E7D6B;
    --info:#4A6FA5;
    --line:#D7DEE3;
    --line-strong:#B9C4CC;
    --radius:10px;
    --shadow:0 1px 2px rgba(15,35,64,.06), 0 6px 16px rgba(15,35,64,.06);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Inter',sans-serif;
    color:var(--ink);
    background:
      linear-gradient(var(--line) 1px, transparent 1px) 0 0/100% 28px,
      linear-gradient(90deg, var(--line) 1px, transparent 1px) 0 0/28px 100%,
      var(--bg);
    background-attachment:fixed;
    background-blend-mode:normal;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  body::before{
    content:"";
    position:fixed; inset:0;
    background-image:
      linear-gradient(rgba(238,242,244,.86), rgba(238,242,244,.86));
    pointer-events:none; z-index:-1;
  }
  h1,h2,h3,.display{font-family:'Space Grotesk',sans-serif; letter-spacing:-.01em;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  button{font-family:inherit; cursor:pointer;}
  input,select{font-family:inherit;}
  ::selection{background:var(--accent); color:#fff;}

  /* ---------- Topbar ---------- */
  .topbar{
    position:sticky; top:0; z-index:40;
    background:var(--primary);
    color:#fff;
    border-bottom:3px solid var(--accent);
  }
  .topbar-inner{
    max-width:1180px; margin:0 auto; padding:14px 20px;
    display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap;
  }
  .brand{display:flex; align-items:center; gap:12px;}
  .brand-mark{
    width:40px;height:40px;border-radius:8px;
    background:var(--accent);
    display:flex;align-items:center;justify-content:center;
    color:var(--primary); font-family:'Space Grotesk'; font-weight:700; font-size:15px;
    flex-shrink:0;
    box-shadow:inset 0 0 0 2px rgba(15,35,64,.15);
  }
  .brand-text .eyebrow{font-size:11px; letter-spacing:.14em; text-transform:uppercase; opacity:.75; font-weight:600;}
  .brand-text h1{font-size:17px; margin:1px 0 0; font-weight:700; line-height:1.2;}

  .role-switch{
    display:flex; background:rgba(255,255,255,.1); border-radius:999px; padding:3px; gap:2px;
    border:1px solid rgba(255,255,255,.18);
  }
  .role-switch button{
    border:none; background:transparent; color:rgba(255,255,255,.75);
    padding:7px 16px; border-radius:999px; font-size:13px; font-weight:600;
    transition:.15s;
  }
  .role-switch button.active{ background:var(--accent); color:var(--primary); }

  /* ---------- Layout ---------- */
  .wrap{max-width:1180px; margin:0 auto; padding:24px 20px 64px;}

  .selector-card{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    box-shadow:var(--shadow); padding:18px 20px; margin-bottom:18px;
  }
  .selector-row{display:flex; flex-wrap:wrap; gap:22px; align-items:flex-start;}
  .selector-group{flex:1; min-width:240px;}
  .selector-label{font-size:11px; text-transform:uppercase; letter-spacing:.1em; color:var(--ink-soft); font-weight:700; margin-bottom:8px; display:block;}
  .prodi-tabs{display:flex; flex-wrap:wrap; gap:8px;}
  .prodi-tab{
    border:1px solid var(--line-strong); background:var(--paper); color:var(--ink);
    padding:8px 12px; border-radius:8px; font-size:12.5px; font-weight:600;
    display:flex; flex-direction:column; align-items:flex-start; gap:2px; line-height:1.25;
    transition:.15s; min-width:120px;
  }
  .prodi-tab .code{font-family:'IBM Plex Mono'; font-size:10.5px; color:var(--accent-ink); font-weight:600;}
  .prodi-tab:hover{border-color:var(--primary-light);}
  .prodi-tab.active{background:var(--primary); border-color:var(--primary); color:#fff;}
  .prodi-tab.active .code{color:var(--accent);}

  .kelas-chips{display:flex; flex-wrap:wrap; gap:6px;}
  .kelas-chip{
    border:1px solid var(--line-strong); background:var(--paper);
    padding:6px 12px; border-radius:999px; font-size:12.5px; font-weight:600; color:var(--ink-soft);
    font-family:'IBM Plex Mono';
  }
  .kelas-chip.active{background:var(--accent); border-color:var(--accent); color:var(--accent-ink);}
  .kelas-chip:hover{border-color:var(--primary-light); color:var(--ink);}

  /* ---------- Tabs ---------- */
  .tabnav{display:flex; gap:4px; border-bottom:1px solid var(--line-strong); margin-bottom:20px; flex-wrap:wrap;}
  .tabnav button{
    border:none; background:none; padding:10px 16px; font-size:13.5px; font-weight:600;
    color:var(--ink-soft); border-bottom:2px solid transparent; margin-bottom:-1px;
  }
  .tabnav button.active{color:var(--primary); border-bottom-color:var(--accent);}
  .tabnav button:hover{color:var(--primary);}

  /* ---------- Card with corner brackets (signature element) ---------- */
  .panel{
    position:relative;
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    box-shadow:var(--shadow); padding:22px 24px; margin-bottom:18px;
  }
  .panel::before,.panel::after,.panel .cb1,.panel .cb2{
    content:""; position:absolute; width:14px; height:14px; pointer-events:none;
  }
  .panel::before{ top:-1px; left:-1px; border-top:2px solid var(--accent); border-left:2px solid var(--accent); }
  .panel::after{ bottom:-1px; right:-1px; border-bottom:2px solid var(--accent); border-right:2px solid var(--accent); }
  .panel-head{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:16px; flex-wrap:wrap;}
  .panel-head h2{font-size:16px; margin:0; font-weight:700;}
  .panel-head p{font-size:12.5px; color:var(--ink-soft); margin:3px 0 0;}

  /* ---------- Buttons ---------- */
  .btn{
    display:inline-flex; align-items:center; gap:6px; border-radius:7px; padding:8px 14px;
    font-size:13px; font-weight:600; border:1px solid transparent; transition:.15s;
  }
  .btn-primary{background:var(--primary); color:#fff;}
  .btn-primary:hover{background:var(--primary-light);}
  .btn-accent{background:var(--accent); color:var(--accent-ink);}
  .btn-accent:hover{filter:brightness(1.05);}
  .btn-ghost{background:transparent; border-color:var(--line-strong); color:var(--ink-soft);}
  .btn-ghost:hover{border-color:var(--primary-light); color:var(--primary);}
  .btn-danger-ghost{background:transparent; border-color:var(--line-strong); color:var(--danger);}
  .btn-danger-ghost:hover{background:#FBEBE9; border-color:var(--danger);}
  .btn-sm{padding:5px 10px; font-size:12px;}
  .btn:disabled{opacity:.45; cursor:not-allowed;}

  /* ---------- Table ---------- */
  table{width:100%; border-collapse:collapse; font-size:13px;}
  th{
    text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.07em; color:var(--ink-soft);
    padding:9px 10px; border-bottom:1px solid var(--line-strong); font-weight:700;
  }
  td{padding:9px 10px; border-bottom:1px solid var(--line);}
  tr:last-child td{border-bottom:none;}
  .nim{font-family:'IBM Plex Mono'; color:var(--primary); font-weight:500;}

  /* ---------- Excel-style recap table ---------- */
  .excel-table{border-collapse:collapse; width:100%; font-size:12.5px;}
  .excel-table th,.excel-table td{border:1px solid #444B54;}
  .excel-table thead th{
    background:var(--paper); color:var(--ink); text-transform:none; letter-spacing:0;
    font-weight:700; font-size:12.5px; text-align:center; padding:7px 8px; vertical-align:middle;
  }
  .excel-table tbody td{padding:6px 10px;}
  .excel-table tbody tr:nth-child(even){background:#FAFBFC;}
  .excel-table tbody tr:hover{background:#EEF4FA;}
  .empty-state{
    text-align:center; padding:36px 20px; color:var(--ink-soft);
  }
  .empty-state .glyph{font-size:26px; margin-bottom:8px;}
  .empty-state h3{font-size:14px; color:var(--ink); margin:0 0 4px;}
  .empty-state p{font-size:12.5px; margin:0;}

  /* ---------- Forms ---------- */
  .field-row{display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end;}
  .field{display:flex; flex-direction:column; gap:5px;}
  .field label{font-size:11px; font-weight:700; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.06em;}
  .field input,.field select{
    border:1px solid var(--line-strong); border-radius:7px; padding:8px 10px; font-size:13px; color:var(--ink);
    background:var(--paper); min-width:160px;
  }
  .field input:focus,.field select:focus{outline:2px solid var(--primary-light); outline-offset:1px; border-color:var(--primary-light);}

  /* ---------- Chips list (matkul) ---------- */
  .chip-list{display:flex; flex-wrap:wrap; gap:8px; margin-top:14px;}
  .matkul-chip{
    display:flex; align-items:center; gap:8px; background:var(--paper); border:1px solid var(--line-strong);
    border-radius:999px; padding:6px 8px 6px 14px; font-size:12.5px; font-weight:600;
  }
  .matkul-chip button{border:none; background:var(--line-strong); color:var(--ink); width:18px; height:18px; border-radius:50%; font-size:11px; line-height:1;}
  .matkul-chip button:hover{background:var(--danger); color:#fff;}

  /* ---------- Scan cards ---------- */
  .scan-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:14px; margin-top:14px;}
  .scan-card{border:1px solid var(--line); border-radius:9px; overflow:hidden; background:var(--paper);}
  .scan-thumb{width:100%; height:130px; object-fit:cover; display:block; background:#dde3e7; cursor:zoom-in;}
  .scan-meta{padding:10px 12px;}
  .scan-meta .mk{font-size:12.5px; font-weight:700; margin:0 0 2px;}
  .scan-meta .dt{font-size:11.5px; color:var(--ink-soft); font-family:'IBM Plex Mono'; margin:0 0 8px;}
  .scan-actions{display:flex; gap:6px;}

  /* stamp badge */
  .stamp{
    display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:5px;
    font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.05em;
    border:1.5px dashed currentColor;
  }
  .stamp-done{color:var(--success);}
  .stamp-pending{color:var(--accent-ink);}

  /* ---------- Status radio "stamps" ---------- */
  .status-group{display:flex; gap:4px;}
  .status-opt{position:relative;}
  .status-opt input{position:absolute; opacity:0; inset:0; cursor:pointer;}
  .status-opt span{
    display:block; padding:5px 9px; border-radius:6px; font-size:11px; font-weight:700; text-align:center;
    border:1.5px solid var(--line-strong); color:var(--ink-soft); min-width:44px;
  }
  .status-opt input:checked + span.H{background:#E4F3EE; border-color:var(--success); color:var(--success);}
  .status-opt input:checked + span.I{background:#FDF0DE; border-color:var(--accent); color:var(--accent-ink);}
  .status-opt input:checked + span.S{background:#E9EFF8; border-color:var(--info); color:var(--info);}
  .status-opt input:checked + span.A{background:#FAE7E5; border-color:var(--danger); color:var(--danger);}
  .status-opt input:focus-visible + span{outline:2px solid var(--primary-light); outline-offset:1px;}

  /* ---------- Modal ---------- */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(15,35,64,.55); backdrop-filter:blur(1px);
    display:flex; align-items:center; justify-content:center; padding:20px; z-index:100;
  }
  .modal{
    background:#fff; border-radius:12px; max-width:760px; width:100%; max-height:88vh; overflow:auto;
    box-shadow:0 20px 60px rgba(0,0,0,.3);
  }
  .modal-head{display:flex; align-items:center; justify-content:space-between; padding:16px 20px; border-bottom:1px solid var(--line); position:sticky; top:0; background:#fff;}
  .modal-head h3{margin:0; font-size:15px;}
  .modal-close{border:none; background:var(--paper); width:28px; height:28px; border-radius:50%; font-size:15px; color:var(--ink-soft);}
  .modal-body{padding:18px 20px;}
  .modal img.full{width:100%; border-radius:8px; border:1px solid var(--line); margin-bottom:16px;}

  .stat-row{display:flex; gap:12px; flex-wrap:wrap; margin-bottom:18px;}
  .stat-box{flex:1; min-width:130px; background:var(--surface); border:1px solid var(--line); border-radius:9px; padding:12px 14px;}
  .stat-box .num{font-family:'Space Grotesk'; font-size:22px; font-weight:700; color:var(--primary);}
  .stat-box .lab{font-size:11px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.06em; font-weight:600;}

  .note{
    font-size:12px; color:var(--ink-soft); background:var(--paper); border:1px dashed var(--line-strong);
    border-radius:8px; padding:10px 12px; margin-top:14px; line-height:1.5;
  }
  .footer-note{max-width:1180px; margin:0 auto; padding:0 20px 40px; font-size:11.5px; color:var(--ink-soft); text-align:center;}

  @media (max-width:640px){
    .panel{padding:18px;}
    .topbar-inner{flex-direction:column; align-items:flex-start;}
  }
</style>
</head>

const MATKUL_SMT3_D3TM = [

  { nama:'Labor Pengujian Bahan & Mekanika Teknik', jam:3, hari:'Kamis' },
  { nama:'Teknik Produksi', jam:5, hari:'Kamis' },
  { nama:'Praktek CNC', jam:5, hari:'Jumat' },
  { nama:'Praktek Produksi 1', jam:5, hari:'Jumat' },
];
const SEED_MATKUL = {
  'd3tm:2A': MATKUL_SMT3_D3TM,
  'd3tm:2B': MATKUL_SMT3_D3TM,
  'd3tm:2C': MATKUL_SMT3_D3TM,
  'd3tm:2D': MATKUL_SMT3_D3TM,
  'd3tm:2E': MATKUL_SMT3_D3TM,
  'd3tm:2F': MATKUL_SMT3_D3TM,
};

let state = {
  role: 'admin', // 'admin' | 'ketua'
  prodi: PRODI[0].key,
  kelas: PRODI[0].kelas[0],
  tab: 'mahasiswa', // mahasiswa | matkul | upload | rekap
  students: [],
  matkul: [],
  scans: [],
  rekap: {},   // scanId -> { studentId: statusCode }
  loading: true,
  modal: null, // { type:'image', url } | { type:'rekap', scan }
  summaryMatkulId: null,
  semesterStart: null, // 'YYYY-MM-DD', tanggal Senin minggu pertama semester (per kelas)
};

function currentProdi(){ return PRODI.find(p=>p.key===state.prodi); }
function keyBase(){ return state.prodi+':'+state.kelas; }

async function loadClass(){
  state.loading = true; render();
  const base = keyBase();
  const [rosterRes, matkul, scans, rekap, semStart] = await Promise.all([
    safeGetRaw('roster:'+base),
    safeGet('matkul:'+base, []),
    safeGet('scans:'+base, []),
    safeGet('rekap:'+base, {}),
    safeGet('semesterStart:'+base, null),
  ]);
  if(rosterRes.found){
    state.students = rosterRes.value;
  } else if(SEED_STUDENTS[base]){
    // first time this class is opened: pre-fill with the official roster provided
    state.students = SEED_STUDENTS[base].map(s=>({id:uid(), nama:s.nama, nim:s.nim}));
    await saveStudents();
  } else {
    state.students = [];
  }
  if(matkul && matkul.length){
    state.matkul = matkul;
  } else if(SEED_MATKUL[base]){
    // first time this class is opened: pre-fill with the official matkul list (with jam/pertemuan + hari perkiraan)
    state.matkul = SEED_MATKUL[base].map(m=>({id:uid(), nama:m.nama, jam:m.jam, hari:m.hari||null}));
    await saveMatkul();
  } else {
    state.matkul = matkul;
  }
  state.scans = scans;
  state.rekap = rekap;
  if(semStart){
    state.semesterStart = semStart;
  } else {
    // belum pernah diatur untuk kelas ini -> pakai default semester berjalan
    state.semesterStart = DEFAULT_SEMESTER_START;
    await saveSemesterStart();
  }
  state.loading = false;
  render();
}
async function safeGet(key, fallback){
  const r = await safeGetRaw(key);
  return r.found ? r.value : fallback;
}
async function safeGetRaw(key){
  try{
    const r = await window.storage.get(key, true);
    if(r && r.value) return { found:true, value: JSON.parse(r.value) };
    return { found:false, value:null };
  }catch(e){ return { found:false, value:null }; }
}
async function saveStudents(){ await safeSet('roster:'+keyBase(), state.students); }
async function saveMatkul(){ await safeSet('matkul:'+keyBase(), state.matkul); }
async function saveScans(){ await safeSet('scans:'+keyBase(), state.scans); }
async function saveRekap(){ await safeSet('rekap:'+keyBase(), state.rekap); }
async function saveSemesterStart(){ await safeSet('semesterStart:'+keyBase(), state.semesterStart); }
async function safeSet(key, value){
  try{
    await window.storage.set(key, JSON.stringify(value), true);
  }catch(e){
    console.error('Gagal menyimpan ke storage:', key, e);
    // Data tetap ada di memori (state) walau gagal tersimpan permanen,
    // jadi tampilan tidak boleh berhenti hanya karena ini gagal.
  }
}

function uid(){ return (crypto.randomUUID ? crypto.randomUUID() : 'id-'+Date.now()+'-'+Math.random().toString(16).slice(2)); }

/* ---------------- Render ---------------- */
function render(){
  renderRoleSwitch();
  const app = document.getElementById('app');
  app.innerHTML = `
    ${renderSelector()}
    ${renderTabnav()}
    ${state.loading ? '<div class="panel"><div class="empty-state"><div class="glyph">&#9203;</div><p>Memuat data kelas&hellip;</p></div></div>' : renderTabContent()}
  `;
  attachHandlers();
  renderModal();
}

function renderRoleSwitch(){
  document.getElementById('roleSwitch').innerHTML = `
    <button data-role="admin" class="${state.role==='admin'?'active':''}">Admin</button>
    <button data-role="ketua" class="${state.role==='ketua'?'active':''}">Ketua Kelas</button>
  `;
}

function renderSelector(){
  const prodi = currentProdi();
  return `
  <div class="selector-card">
    <div class="selector-row">
      <div class="selector-group">
        <span class="selector-label">Program Studi</span>
        <div class="prodi-tabs">
          ${PRODI.map(p=>`
            <button class="prodi-tab ${p.key===state.prodi?'active':''}" data-prodi="${p.key}">
              <span class="code">${p.kode}</span>
              <span>${p.nama}</span>
            </button>`).join('')}
        </div>
      </div>
      <div class="selector-group" style="max-width:420px;">
        <span class="selector-label">Kelas &mdash; ${prodi.nama}</span>
        <div class="kelas-chips">
          ${prodi.kelas.map(k=>`<button class="kelas-chip ${k===state.kelas?'active':''}" data-kelas="${k}">${k}</button>`).join('')}
        </div>
      </div>
    </div>
  </div>`;
}

function renderTabnav(){
  const tabs = [
    {id:'mahasiswa', label:'Data Mahasiswa'},
    {id:'matkul', label:'Mata Kuliah'},
    {id:'upload', label:'Upload Absensi'},
    {id:'rekap', label:'Rekap Kehadiran'},
  ];
  return `<div class="tabnav">
    ${tabs.map(t=>`<button class="${state.tab===t.id?'active':''}" data-tab="${t.id}">${t.label}</button>`).join('')}
  </div>`;
}

function renderTabContent(){
  if(state.tab==='mahasiswa') return renderMahasiswa();
  if(state.tab==='matkul') return renderMatkul();
  if(state.tab==='upload') return renderUpload();
  if(state.tab==='rekap') return renderRekap();
  return '';
}

/* ---- Rekap Kehadiran ---- */
function renderRekap(){
  const total = state.scans.length;

  const stat = `
  <div class="stat-row">

    <div class="stat-box"><div class="num">${done}</div><div class="lab">Sudah Direkap</div></div>
    <div class="stat-box"><div class="num">${pending}</div><div class="lab">Belum Direkap</div></div>
  </div>`;

  const sorted = [...state.scans].sort((a,b)=> b.tanggal.localeCompare(a.tanggal));
  const listRows = sorted.map(sc=>`
    <tr>
      <td>${formatDate(sc.tanggal)}</td>
      <td>${escapeHtml(sc.matkulNama)}</td>
      <td><span class="stamp ${sc.direkap?'stamp-done':'stamp-pending'}">${sc.direkap?'Sudah':'Belum'}</span></td>
      <td>
        <button class="btn btn-ghost btn-sm" data-view-image="${sc.id}">Lihat scan</button>

      </td>
    </tr>`).join('');

  const listPanel = `
  <div class="panel">
    <div class="panel-head">
      <div><h2>Daftar Scan &mdash; Kelas ${state.kelas}</h2><p>${state.role==='admin' ? 'Klik "Isi rekap" untuk mencatat kehadiran berdasarkan scan.' : 'Status rekap kehadiran per pertemuan.'}</p></div>
    </div>

      `<div class="empty-state"><div class="glyph">&#128203;</div><h3>Belum ada scan</h3><p>Rekap akan muncul setelah ketua kelas mengunggah scan absensi.</p></div>`}

  const summaryPanel = renderSummaryMatrix();

  return stat + listPanel + summaryPanel;

// Hitung rekap S/I/A dalam PERTEMUAN dan dalam JAM untuk satu mata kuliah tertentu
function hitungRekapMatkul(matkulId){
  const mk = state.matkul.find(m=>m.id===matkulId);
  const jamPerPertemuan = mk ? (mk.jam||1) : 1;
  const scansM = state.scans.filter(s=>s.matkulId===matkulId && s.direkap);
  const totalPertemuan = scansM.length;
  const perStudent = {};
  state.students.forEach(st=>{
    let S=0,I=0,A=0;
    scansM.forEach(sc=>{
      const r = state.rekap[sc.id];
      const status = r ? r[st.id] : null;
      if(status==='S') S++;
      else if(status==='I') I++;
      else if(status==='A') A++;
    });
    perStudent[st.id] = {
      S, I, A, jumlahPertemuan: S+I+A,
      Sjam: S*jamPerPertemuan, Ijam: I*jamPerPertemuan, Ajam: A*jamPerPertemuan,
      jumlahJam: (S+I+A)*jamPerPertemuan,
    };
  });
  return { jamPerPertemuan, totalPertemuan, totalJamMatkul: totalPertemuan*jamPerPertemuan, perStudent };
}

// Kategori SP berdasarkan jam Alpa (A) kumulatif, sesuai aturan jurusan
function spKeterangan(aJam){
  if(aJam<15) return 'OK PA';
  if(aJam<30) return 'SP-1, Konsultasi dgn PA';
  if(aJam<45) return 'SP-2, Konsultasi dgn PA';
  if(aJam<76) return 'SP-3, Konsultasi/Pemanggilan Orang Tua';
  return 'Tidak Dapat Melanjutkan Perkuliahan';
}

function renderSummaryMatrix(){

  if(!state.summaryMatkulId || !state.matkul.find(m=>m.id===state.summaryMatkulId)){

  const matkulOptions = state.matkul.map(m=>`<option value="${m.id}" ${m.id===state.summaryMatkulId?'selected':''}>${escapeHtml(m.nama)} (${m.jam||1} jam/m)</option>`).join('');

  const { jamPerPertemuan, totalPertemuan, totalJamMatkul, perStudent } = hitungRekapMatkul(state.summaryMatkulId);
  const mkAktif = state.matkul.find(m=>m.id===state.summaryMatkulId);

  const rows = state.students.map((st,i)=>{
    const d = perStudent[st.id];

    return `<tr>

      <td class="nim" style="text-align:center;">${escapeHtml(st.nim)}</td>

      <td class="mono" style="text-align:center; font-weight:700;">${d.jumlahJam}</td>

      <td style="white-space:nowrap;">${escapeHtml(ket)}</td>

  }).join('');

  // ---- Tabel total gabungan semua mata kuliah (dalam jam) ----
  const rekapSemua = state.matkul.map(m=>hitungRekapMatkul(m.id));
  const totalJamSemuaMatkul = rekapSemua.reduce((a,r)=>a+r.totalJamMatkul,0);
  const totalRows = state.students.map((st,i)=>{
    let S=0,I=0,A=0;
    rekapSemua.forEach(r=>{
      const d = r.perStudent[st.id];
      S += d.Sjam; I += d.Ijam; A += d.Ajam;
    });
    const jumlah = S+I+A;
    const pktos = 0;
    const komp = I*1 + A*2 + pktos;

    return `<tr>
      <td class="mono" style="text-align:center;">${i+1}</td>
      <td class="nim" style="text-align:center;">${escapeHtml(st.nim)}</td>
      <td>${escapeHtml(st.nama)}</td>
      <td class="mono" style="text-align:center;">${S}</td>
      <td class="mono" style="text-align:center;">${I}</td>
      <td class="mono" style="text-align:center;">${A}</td>

      <td class="mono" style="text-align:center; font-weight:700;">${komp}</td>
      <td style="white-space:nowrap;">${escapeHtml(ket)}</td>

  return `

    <div class="panel-head">
      <div><h2>Rekap Absensi per Mata Kuliah &mdash; Kelas ${state.kelas}</h2><p>S, I, A dihitung dalam <strong>jam</strong> (jumlah pertemuan &times; jam/pertemuan mata kuliah). PKTOS diisi manual oleh admin (default 0). JUMLAH KOMPENSASI = (S&times;0)+(I&times;1)+(A&times;2)+PKTOS.</p></div>
    </div>
    <div class="field" style="max-width:360px; margin-bottom:14px;">
      <label>Mata Kuliah</label>
      <select id="summaryMatkulSelect">${matkulOptions}</select>
    </div>
    ${totalPertemuan ? '' : `<div class="note">Belum ada pertemuan yang direkap untuk mata kuliah ini. Angka akan muncul setelah admin mengisi rekap dari scan.</div>`}
    <div style="overflow-x:auto;">
      <table class="excel-table">
        <thead>
          <tr>
            <th rowspan="2">No</th>
            <th rowspan="2">BP</th>
            <th rowspan="2">NAMA</th>
            <th colspan="3">JAM (S / I / A)</th>
            <th rowspan="2">JUMLAH<br>JAM</th>
            <th rowspan="2">PKTOS</th>
            <th rowspan="2">JUMLAH<br>KOMPENSASI</th>
            <th rowspan="2">KETERANGAN</th>
          </tr>
          <tr>
            <th>S</th><th>I</th><th>A</th>
          </tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
    <p class="note">Mata kuliah ${escapeHtml(mkAktif?mkAktif.nama:'')}: ${jamPerPertemuan} jam/pertemuan &middot; ${totalPertemuan} pertemuan direkap &middot; total ${totalJamMatkul} jam.</p>
  </div>

  <div class="panel">
    <div class="panel-head">
      <div><h2>Rekap Total Gabungan Semua Mata Kuliah &mdash; Kelas ${state.kelas}</h2><p>Jumlah jam S/I/A dari seluruh mata kuliah dijumlahkan per mahasiswa. JUMLAH KOMPENSASI &amp; KETERANGAN dihitung dari total gabungan ini.</p></div>

            <th rowspan="2">KETERANGAN</th>
          </tr>
          <tr>
            <th>S</th><th>I</th><th>A</th>
          </tr>
        </thead>
        <tbody>${totalRows}</tbody>
      </table>
    </div>
    <p class="note">Total jam seluruh mata kuliah (${state.matkul.length} matkul) yang sudah direkap: <strong>${totalJamSemuaMatkul}</strong> jam.</p>
  </div>

  <div class="panel">
    <div class="panel-head">
      <div><h2>Export ke Excel &mdash; Format Resmi Mingguan</h2><p>Menghasilkan file .xlsx per minggu (Minggu-1, Minggu-2, dst) sesuai format rekapitulasi absensi jurusan, dengan angka kumulatif sejak awal semester.</p></div>
    </div>

    ${!state.matkul.some(m=>m.hari) ? `<div class="note">Atur <strong>Hari</strong> untuk mata kuliah di tab "Mata Kuliah" dulu, supaya kolom mingguan tersusun benar.</div>` : ''}

/* ---------------- Modal ---------------- */
function renderModal(){
  let existing = document.getElementById('modalRoot');
  if(existing) existing.remove();
  if(!state.modal) return;

  const root = document.createElement('div');
  root.id = 'modalRoot';
  document.body.appendChild(root);

  if(state.modal.type==='image'){
    const sc = state.scans.find(s=>s.id===state.modal.id);
    if(!sc){ state.modal=null; return; }
    root.innerHTML = `
      <div class="modal-overlay" data-close-modal="1">
        <div class="modal" onclick="event.stopPropagation()">
          <div class="modal-head"><h3>${escapeHtml(sc.matkulNama)} &middot; ${formatDate(sc.tanggal)}</h3><button class="modal-close" data-close-modal="1">&times;</button></div>
          <div class="modal-body"><img class="full" src="${sc.dataUrl}" alt="Scan absensi"></div>
        </div>
      </div>`;
  }

  if(state.modal.type==='rekap'){
    const sc = state.scans.find(s=>s.id===state.modal.id);
    if(!sc){ state.modal=null; return; }
    const existingRekap = state.rekap[sc.id] || {};
    const rows = state.students.map((st,i)=>`
      <tr>
        <td class="mono">${i+1}</td>
        <td>${escapeHtml(st.nama)}</td>
        <td class="nim">${escapeHtml(st.nim)}</td>
        <td>
          <div class="status-group">
            ${STATUS.map(op=>`
              <label class="status-opt">
                <input type="radio" name="st_${st.id}" value="${op.code}" ${(existingRekap[st.id]||'H')===op.code?'checked':''}>
                <span class="${op.code}">${op.code}</span>
              </label>`).join('')}
          </div>
        </td>
      </tr>`).join('');

    root.innerHTML = `
      <div class="modal-overlay" data-close-modal="1">
        <div class="modal" onclick="event.stopPropagation()">
          <div class="modal-head">
            <h3>Isi Rekap &mdash; ${escapeHtml(sc.matkulNama)} &middot; ${formatDate(sc.tanggal)}</h3>
            <button class="modal-close" data-close-modal="1">&times;</button>
          </div>
          <div class="modal-body">
            <img class="full" src="${sc.dataUrl}" alt="Scan absensi">
            ${state.students.length ? `
            <form id="rekapForm">
              <table>
                <thead><tr><th style="width:34px;">No</th><th>Nama</th><th>NIM</th><th style="width:190px;">Status</th></tr></thead>
                <tbody>${rows}</tbody>
              </table>
              <div style="display:flex; justify-content:flex-end; gap:8px; margin-top:16px;">
                <button type="button" class="btn btn-ghost" data-close-modal="1">Batal</button>
                <button type="submit" class="btn btn-primary">Simpan Rekap</button>
              </div>
            </form>` : `<div class="empty-state"><p>Belum ada data mahasiswa di kelas ini.</p></div>`}
          </div>
        </div>
      </div>`;
  }

  root.querySelectorAll('[data-close-modal]').forEach(el=> el.addEventListener('click', ()=>{ state.modal=null; renderModal(); }));
  const rekapForm = document.getElementById('rekapForm');
  if(rekapForm){
    rekapForm.addEventListener('submit', (e)=>{
      e.preventDefault();
      const scanId = state.modal.id;
      const result = {};
      state.students.forEach(st=>{
        const checked = rekapForm.querySelector(`input[name="st_${st.id}"]:checked`);
        result[st.id] = checked ? checked.value : 'H';
      });
      state.rekap[scanId] = result;
      const scan = state.scans.find(s=>s.id===scanId);
      if(scan) scan.direkap = true;
      state.modal = null;
      render();
      saveRekap(); saveScans();
    });
  }
}

/* ---------------- Handlers ---------------- */
function attachHandlers(){
  document.querySelectorAll('[data-role]').forEach(b=> b.addEventListener('click', ()=>{ state.role=b.dataset.role; render(); }));
  document.querySelectorAll('[data-prodi]').forEach(b=> b.addEventListener('click', ()=>{
    state.prodi = b.dataset.prodi;
    state.kelas = currentProdi().kelas[0];
    loadClass();
  }));
  document.querySelectorAll('[data-kelas]').forEach(b=> b.addEventListener('click', ()=>{ state.kelas=b.dataset.kelas; loadClass(); }));
  document.querySelectorAll('[data-tab]').forEach(b=> b.addEventListener('click', ()=>{ state.tab=b.dataset.tab; render(); }));

  const addStudentForm = document.getElementById('addStudentForm');
  if(addStudentForm) addStudentForm.addEventListener('submit', (e)=>{
    e.preventDefault();
    const fd = new FormData(addStudentForm);
    const nama = fd.get('nama').trim(), nim = fd.get('nim').trim();
    if(!nama||!nim) return;
    state.students.push({id:uid(), nama, nim});
    render();
    saveStudents();
  });
  const toggleImportBtn = document.getElementById('toggleImportBtn');
  const importBox = document.getElementById('importBox');
  if(toggleImportBtn) toggleImportBtn.addEventListener('click', ()=>{ importBox.style.display = importBox.style.display==='none' ? 'block' : 'none'; });
  const cancelImportBtn = document.getElementById('cancelImportBtn');
  if(cancelImportBtn) cancelImportBtn.addEventListener('click', ()=>{ importBox.style.display='none'; });
  const importStudentForm = document.getElementById('importStudentForm');
  if(importStudentForm) importStudentForm.addEventListener('submit', (e)=>{
    e.preventDefault();
    const raw = new FormData(importStudentForm).get('bulk') || '';
    const lines = raw.split('\n').map(l=>l.trim()).filter(Boolean);
    let added = 0;
    lines.forEach(line=>{
      const parts = line.split(/\t|,|;/).map(p=>p.trim()).filter(Boolean);
      if(parts.length<2) return;
      const nim = parts.find(p=>/^\d{6,}$/.test(p));
      const nama = parts.filter(p=>p!==nim).join(' ');
      if(!nim || !nama) return;
      state.students.push({id:uid(), nama, nim});
      added++;
    });
    if(!added) alert('Tidak ada baris valid ditemukan. Pastikan format: Nama, NIM');
    render();
    if(added) saveStudents();
  });
  document.querySelectorAll('[data-del-student]').forEach(b=> b.addEventListener('click', ()=>{
    if(!confirm('Hapus mahasiswa ini?')) return;
    state.students = state.students.filter(s=>s.id!==b.dataset.delStudent);
    render();
    saveStudents();
  }));
  document.querySelectorAll('[data-edit-student]').forEach(b=> b.addEventListener('click', ()=>{
    const st = state.students.find(s=>s.id===b.dataset.editStudent);
    if(!st) return;
    const nama = prompt('Nama:', st.nama); if(nama===null) return;
    const nim = prompt('NIM:', st.nim); if(nim===null) return;
    st.nama = nama.trim()||st.nama; st.nim = nim.trim()||st.nim;
    render();
    saveStudents();
  }));

  const addMatkulForm = document.getElementById('addMatkulForm');
  if(addMatkulForm) addMatkulForm.addEventListener('submit', (e)=>{
    e.preventDefault();
    const fd = new FormData(addMatkulForm);
    const nama = fd.get('nama').trim();
    const jam = parseFloat(fd.get('jam'));
    const hari = fd.get('hari') || null;
    if(!nama || !jam || jam<=0) return;
    state.matkul.push({id:uid(), nama, jam, hari});
    render();
    saveMatkul();
  });
  document.querySelectorAll('[data-del-matkul]').forEach(b=> b.addEventListener('click', ()=>{
    if(!confirm('Hapus mata kuliah ini?')) return;
    state.matkul = state.matkul.filter(m=>m.id!==b.dataset.delMatkul);
    render();
    saveMatkul();
  }));
  document.querySelectorAll('[data-set-hari]').forEach(sel=> sel.addEventListener('change', ()=>{
    const mk = state.matkul.find(m=>m.id===sel.dataset.setHari);
    if(mk){ mk.hari = sel.value || null; saveMatkul(); }
  }));
  const semesterStartInput = document.getElementById('semesterStartInput');
  if(semesterStartInput) semesterStartInput.addEventListener('change', ()=>{
    state.semesterStart = semesterStartInput.value || null;
    saveSemesterStart();
  });

  const uploadForm = document.getElementById('uploadScanForm');
  if(uploadForm) uploadForm.addEventListener('submit', async (e)=>{
    e.preventDefault();
    const fd = new FormData(uploadForm);
    const matkulId = fd.get('matkulId');
    const tanggal = fd.get('tanggal');
    const file = fd.get('file');
    if(!matkulId || !tanggal || !file || !file.size){ alert('Lengkapi semua isian.'); return; }
    const mk = state.matkul.find(m=>m.id===matkulId);
    const submitBtn = uploadForm.querySelector('button[type="submit"]');
    submitBtn.disabled = true; submitBtn.textContent = 'Mengunggah...';
    try{
      const dataUrl = await compressImage(file);
      state.scans.push({ id:uid(), matkulId, matkulNama: mk?mk.nama:'(tidak diketahui)', tanggal, dataUrl, uploadedAt:new Date().toISOString(), direkap:false });
      render();
      saveScans();
    }catch(err){
      alert('Gagal memproses gambar. Coba file lain.');
      submitBtn.disabled=false; submitBtn.textContent='↑ Upload Scan';
    }
  });
  document.querySelectorAll('[data-del-scan]').forEach(b=> b.addEventListener('click', ()=>{
    if(!confirm('Hapus scan ini beserta rekapnya?')) return;
    const id = b.dataset.delScan;
    state.scans = state.scans.filter(s=>s.id!==id);
    delete state.rekap[id];
    render();
    saveScans(); saveRekap();
  }));
  document.querySelectorAll('[data-view-image]').forEach(b=> b.addEventListener('click', ()=>{
    state.modal = { type:'image', id:b.dataset.viewImage };
    renderModal();
  }));
  document.querySelectorAll('[data-open-rekap]').forEach(b=> b.addEventListener('click', ()=>{
    state.modal = { type:'rekap', id:b.dataset.openRekap };
    renderModal();
  }));
  const summaryMatkulSelect = document.getElementById('summaryMatkulSelect');
  if(summaryMatkulSelect) summaryMatkulSelect.addEventListener('change', ()=>{
    state.summaryMatkulId = summaryMatkulSelect.value;
    render();
  });
  const exportExcelBtn = document.getElementById('exportExcelBtn');
  if(exportExcelBtn) exportExcelBtn.addEventListener('click', exportOfficialExcel);
}

/* ---------------- Export Excel (format resmi mingguan) ---------------- */
const DAYS_ID = ['Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
const TOTAL_WEEKS = 18;
const DEFAULT_SEMESTER_START = '2026-08-31'; // Senin minggu pertama, default semester ini

function parseISODate(s){ return new Date(s+'T00:00:00'); }
function addDaysDate(d,n){ const r=new Date(d); r.setDate(r.getDate()+n); return r; }
function getMondayOf(d){ const day=d.getDay(); const diff=(day===0?-6:1-day); return addDaysDate(d,diff); }
function fmtDDMMYYYY(d){
  const dd=String(d.getDate()).padStart(2,'0'), mm=String(d.getMonth()+1).padStart(2,'0'), yyyy=d.getFullYear();
  return `${dd}/${mm}/${yyyy}`;
}
function weekIndexForDate(dateStr, semesterStartStr){
  if(!semesterStartStr) return null;
  const start = getMondayOf(parseISODate(semesterStartStr));
  const d = getMondayOf(parseISODate(dateStr));
  const diffDays = Math.round((d-start)/(1000*60*60*24));
  const wk = Math.floor(diffDays/7)+1;
  return wk>=1 ? wk : null;
}
function weekMondayOf(weekNum, semesterStartStr){
  const start = getMondayOf(parseISODate(semesterStartStr));
  return addDaysDate(start, (weekNum-1)*7);
}

// Total S/I/A dalam JAM untuk 1 matkul + 1 mahasiswa, akumulasi dari semua scan yang direkap
// dengan tanggal <= uptoDate (inklusif)
function cumulativeSIA(uptoDate, matkulId, studentId){
  let S=0,I=0,A=0;
  const mk = state.matkul.find(m=>m.id===matkulId);
  const jam = mk ? (mk.jam||1) : 1;
  state.scans.forEach(sc=>{
    if(sc.matkulId!==matkulId || !sc.direkap) return;
    if(parseISODate(sc.tanggal) > uptoDate) return;
    const r = state.rekap[sc.id];
    const status = r ? r[studentId] : null;
    if(status==='S') S+=jam;
    else if(status==='I') I+=jam;
    else if(status==='A') A+=jam;
  });
  return {S,I,A};
}

function exportOfficialExcel(){
  if(typeof XLSX==='undefined'){ alert('Modul Excel belum siap, coba lagi sesaat.'); return; }
  if(!state.semesterStart){ alert('Atur Tanggal Mulai Semester dulu di tab Mata Kuliah.'); return; }
  if(!state.students.length){ alert('Belum ada data mahasiswa.'); return; }

  const matkulByHari = {};
  DAYS_ID.forEach(d=> matkulByHari[d] = state.matkul.filter(m=>m.hari===d));

  const colNO=1, colBP=2, colNAMA=3, colS=4, colI=5, colA=6, colJUMLAH=7, colPKTOS=8, colKOMP=9, colStart=10;
  const data = [];
  const merges = [];
  function setCell(r,c,v){ while(data.length<=r) data.push([]); data[r][c]=v; }
  function mergeRange(r1,c1,r2,c2){ if(r1===r2 && c1===c2) return; merges.push({s:{r:r1,c:c1},e:{r:r2,c:c2}}); }

  let row = 0;
  for(let week=1; week<=TOTAL_WEEKS; week++){
    const monday = weekMondayOf(week, state.semesterStart);
    const saturday = addDaysDate(monday, 5); // Sabtu = akhir minggu kuliah (Senin-Sabtu)
    const prevSaturday = addDaysDate(monday, -2); // Sabtu minggu sebelumnya

    const rTitle=row, rJurusan=row+1, rProdi=row+2, rKelas=row+3, rHead=row+4, rSub=row+5, rJam=row+6, rSIA=row+7;

    setCell(rTitle,colBP,'REKAPITULASI ABSENSI MAHASISWA');
    setCell(rTitle,colStart,'MINGGU - '+week);
    setCell(rJurusan,colBP,'JURUSAN TEKNIK MESIN');
    setCell(rProdi,colBP,'PROGRAM STUDI '+(currentProdi()?currentProdi().nama.toUpperCase():''));
    setCell(rKelas,6,'KELAS : '+state.kelas);

    setCell(rHead,colNO,'NO'); mergeRange(rHead,colNO,rSIA,colNO);
    setCell(rHead,colBP,'BP'); mergeRange(rHead,colBP,rSIA,colBP);
    setCell(rHead,colNAMA,'NAMA'); mergeRange(rHead,colNAMA,rSIA,colNAMA);
    setCell(rHead,colS,'JUMLAH'); mergeRange(rHead,colS,rHead,colA);
    setCell(rHead,colJUMLAH,'JUMLAH S+I+A (Jam)'); mergeRange(rHead,colJUMLAH,rSIA,colJUMLAH);
    setCell(rHead,colPKTOS,'PKTOS (Jam)'); mergeRange(rHead,colPKTOS,rSIA,colPKTOS);
    setCell(rHead,colKOMP,'JUMLAH KOMPENSASI {(Sx0)+(Ix1)+(Ax2)+PKTOS}'); mergeRange(rHead,colKOMP,rSIA,colKOMP);
    setCell(rSub,colS,'S (Jam)'); setCell(rSub,colI,'I (Jam)'); setCell(rSub,colA,'A (Jam)');

    let col = colStart;
    DAYS_ID.forEach((day,dIdx)=>{
      const list = matkulByHari[day];
      if(!list.length) return;
      const dayStartCol = col;
      const dateForDay = addDaysDate(monday, dIdx);
      list.forEach(mk=>{
        setCell(rSub,col,mk.nama); mergeRange(rSub,col,rSub,col+2);
        setCell(rJam,col,(mk.jam||1)+' jam'); mergeRange(rJam,col,rJam,col+2);
        setCell(rSIA,col,'S'); setCell(rSIA,col+1,'I'); setCell(rSIA,col+2,'A');
        col+=3;
      });
      setCell(rHead,dayStartCol, day+', '+fmtDDMMYYYY(dateForDay));
      mergeRange(rHead,dayStartCol,rHead,col-1);
    });
    const ketCol = col;
    setCell(rHead,ketCol,'KET.'); mergeRange(rHead,ketCol,rSIA,ketCol);

    let r = rSIA+1;
    state.students.forEach((st,i)=>{
      setCell(r,colNO,i+1);
      setCell(r,colBP,st.nim);
      setCell(r,colNAMA,st.nama);
      let c2 = colStart;
      DAYS_ID.forEach(day=>{
        matkulByHari[day].forEach(mk=>{
          const cumNow = cumulativeSIA(saturday, mk.id, st.id);
          const cumPrev = week>1 ? cumulativeSIA(prevSaturday, mk.id, st.id) : {S:0,I:0,A:0};
          const wS=cumNow.S-cumPrev.S, wI=cumNow.I-cumPrev.I, wA=cumNow.A-cumPrev.A;
          if(wS) setCell(r,c2,wS);
          if(wI) setCell(r,c2+1,wI);
          if(wA) setCell(r,c2+2,wA);
          c2+=3;
        });
      });
      const total = state.matkul.reduce((acc,mk)=>{
        const c = cumulativeSIA(saturday, mk.id, st.id);
        acc.S+=c.S; acc.I+=c.I; acc.A+=c.A;
        return acc;
      },{S:0,I:0,A:0});
      setCell(r,colS,total.S); setCell(r,colI,total.I); setCell(r,colA,total.A);
      setCell(r,colJUMLAH,total.S+total.I+total.A);
      setCell(r,colPKTOS,0);
      setCell(r,colKOMP, total.I*1 + total.A*2 + 0);
      setCell(r,ketCol, spKeterangan(total.A));
      r++;
    });

    row = r+2; // spasi sebelum blok minggu berikutnya
  }

  const ws = XLSX.utils.aoa_to_sheet(data);
  ws['!merges'] = merges;
  ws['!cols'] = [{wch:2},{wch:5},{wch:14},{wch:26},{wch:8},{wch:8},{wch:8},{wch:10},{wch:10},{wch:12}];
  const wb = XLSX.utils.book_new();
  const sheetName = (state.kelas||'Kelas').slice(0,31);
  XLSX.utils.book_append_sheet(wb, ws, sheetName);
  const fname = `Rekap_Absensi_${state.prodi}_${state.kelas}.xlsx`;
  XLSX.writeFile(wb, fname);
}

/* ---------------- Utils ---------------- */
function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function todayStr(){ return new Date().toISOString().slice(0,10); }
function formatDate(d){
  const dt = new Date(d+'T00:00:00');
  return dt.toLocaleDateString('id-ID', {day:'2-digit', month:'short', year:'numeric'});
}
function compressImage(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      const img = new Image();
      img.onload = ()=>{
        const maxDim = 1200;
        let w = img.width, h = img.height;
        if(w>maxDim || h>maxDim){
          if(w>h){ h = Math.round(h*maxDim/w); w = maxDim; }
          else { w = Math.round(w*maxDim/h); h = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#fff'; ctx.fillRect(0,0,w,h);
        ctx.drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', 0.72));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
